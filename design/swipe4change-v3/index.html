  // ───────────────────────── 3. WRITE ─────────────────────────
  const W = () => state.write;
  function valid(k) {
    const v = W().a[k];
    if (k === 'title') return v.trim().length >= 8;
    if (k === 'problem' || k === 'action') return v.trim().length >= 20;
    if (k === 'goal') return Number(v) >= 10;
    return String(v).trim().length > 0;
  }
  function answeredCount() {
    return QS.filter((q) => valid(q.k)).length;
  }
  const RULES = [
    ['title', 'Title is specific (20–80 characters)', (a) => a.title.trim().length >= 20 && a.title.trim().length <= 80],
    ['problem', 'Problem says who is affected (80+ characters)', (a) => a.problem.trim().length >= 80],
    ['action', 'One clear, concrete request', (a) => a.action.trim().length >= 25],
    ['place', 'Says where it is happening', (a) => !!a.place.trim()],
    ['topic', 'Topic chosen', (a) => !!a.topic],
    ['recipient', 'Names who can decide', (a) => !!a.recipient.trim()],
    ['goal', 'Signature goal set', (a) => Number(a.goal) >= 10],
    ['verify', 'Signing rule chosen', (a) => !!a.verify],
  ];
  const score = () => Math.round((RULES.filter((r) => r[2](W().a)).length / RULES.length) * 100);
  const ready = () => QS.every((q) => valid(q.k));

  function aiDraft(text) {
    // Prototype stand-in for the server-side writer: it only rearranges the creator's own words and
    // leaves blank anything it cannot find. It never picks a recipient.
    const t = text.trim();
    if (t === EXAMPLE_DESC) {
      return {
        title: 'A safe way across Maple Avenue',
        problem: 'Students walking to Riverton Middle School have to cross Maple Avenue at Hill Street, where there is no crosswalk and cars come quickly around the bend. A student was nearly hit there last week.',
        action: 'Add a painted crosswalk at Maple Avenue and Hill Street and a crossing guard during morning arrival.',
        place: 'Riverton, CA',
        topic: 'Safer streets',
      };
    }
    const sentences = t.split(/(?<=[.!?])\s+/).filter(Boolean);
    const first = (sentences[0] || t).replace(/[.!?]+$/, '');
    let title = first.length > 64 ? first.slice(0, 64).replace(/\s+\S*$/, '') : first;
    title = title.charAt(0).toUpperCase() + title.slice(1);
    const askRe = /\b(need|needs|should|want|ask|please|add|install|fix|repair|build|create|extend|open|replace|plant)\b/i;
    const ask = sentences.find((s) => askRe.test(s)) || '';
    const action = ask.replace(/^(we|i|they)\s+(really\s+)?(need|want|would like|ask)\s+(to\s+|for\s+|that\s+)?/i, '').replace(/[.!?]+$/, '');
    const out = { title, problem: t };
    if (action.length >= 12) out.action = action.charAt(0).toUpperCase() + action.slice(1) + '.';
    const place = ['Riverton', 'Brookside', 'Eastbridge'].find((c) => new RegExp(c, 'i').test(t));
    if (place) out.place = place === 'Eastbridge' ? 'Eastbridge campus' : `${place}, CA`;
    const topicHints = [
      ['Safer streets', /crosswalk|traffic|street|bike|speed|cross|sidewalk|light/i],
      ['Environment', /tree|shade|waste|recycl|compost|water|air|climate/i],
      ['Education', /school|library|study|class|student|teacher/i],
      ['Accessibility', /wheelchair|accessib|ramp|disab|bench|sensory/i],
      ['Public spaces', /park|garden|court|plaza|playground/i],
    ];
    const tp = topicHints.find(([, re]) => re.test(t));
    if (tp) out.topic = tp[0];
    return out;
  }

  function startDraft() {
    const w = W();
    if (w.desc.trim().length < 20) return;
    w.prev = { ...w.a };
    const draft = aiDraft(w.desc);
    w.aiFields = new Set(Object.keys(draft));
    Object.assign(w.a, draft);
    w.draftKeys = Object.keys(draft);
    if (isDesk()) {
      render();
      toast(`Drafted ${w.aiFields.size} answers from your words. Review each one.`);
      return;
    }
    w.stage = 'drafting';
    w.draftTick = 0;
    render();
    const steps = ['title', 'problem', 'action', 'place', 'topic'];
    const tick = () => {
      w.draftTick++;
      if (state.tab !== 'write' || w.stage !== 'drafting') return;
      if (w.draftTick <= steps.length) {
        render();
        setTimeout(tick, reduceMotion() ? 0 : 420);
      } else {
        w.stage = 'q';
        w.step = 0;
        w.dir = 1;
        render();
      }
    };
    setTimeout(tick, reduceMotion() ? 0 : 500);
  }

  function screenWrite() {
    return isDesk() ? writeDesktop() : writeMobile();
  }
  function writeTop(back, title, right = '') {

              return `<li class="${st}"><span class="st">${st === 'done' ? ic('check', 14, 3.2) : ''}</span>${l}${st === 'skip' ? '<span style="margin-left:auto;font-size:12px;font-weight:600">You add this</span>' : ''}</li>`;
            })
            .join('')}</ul>
        </div></div>`;
    }
    if (w.stage === 'review') return writeReviewMobile();

      : q.example
        ? `<button class="w-link" data-action="w-example">${ic('bulb', 20)}${w.example ? 'Hide the example' : 'Show an example'}</button>`
        : '';
    return `<div class="write">
      ${writeTop(true, 'New petition', `<span class="w-count">${w.step + 1}/${QS.length}</span>`)}
      <div class="w-progress" aria-hidden="true"><i style="width:${((w.step + 1) / QS.length) * 100}%"></i></div>
      <div class="w-body ${w.dir < 0 ? 'back' : ''}" id="w-body">
        ${tag}

        ${fieldHTML(q, 'mobile')}
        ${q.type === 'text' ? `<p class="w-hint count"><span>${q.hint}</span><span id="w-cc">${W().a.title.length}/${q.max}</span></p>` : `<p class="w-hint">${q.hint}</p>`}
        ${w.example && q.example && !w.aiFields.has(q.k) ? `<div class="w-example"><b>Example</b>${esc(q.example)}<br/><button data-action="w-use-example">Use this as a starting point</button></div>` : ''}
      </div>
      <div class="w-foot"><button class="btn-primary w-next" id="w-go" data-action="w-next" ${valid(q.k) ? '' : 'disabled'}>${last ? 'Review' : 'Next'}</button></div>
    </div>`;
  }

  function fieldHTML(q, mode) {
    const a = W().a;
    const desk = mode === 'desk';
    const bindAttrs = `data-bind="a.${q.k}" ${desk ? '' : 'id="w-field"'} aria-labelledby="${desk ? `qd-${q.k}` : 'q-label'}"`;

      case 'recipient': {
        const ids = OFFICE_BY_TOPIC[a.topic] || ['public-works', 'parks', 'school-board'];
        const names = ids.map((i) => OFFICES[i]);
        const other = a.recipient && !names.includes(a.recipient) ? a.recipient : '';
        return `<div class="options">${names.map((n) => optBtn('recipient', n, n, '🏛️')).join('')}</div>
          <input class="field-other" type="text" data-bind="a.recipient" data-other="1" value="${esc(other)}" placeholder="Someone else (office or official)" aria-label="Another recipient" />`;

          .map((g) => `<button class="goal" data-action="w-pick" data-k="goal" data-v="${g}" aria-pressed="${Number(a.goal) === g}">${fmt(g)}<small>signatures</small></button>`)
          .join('')}</div>
          <input class="field-other" type="number" min="10" step="10" inputmode="numeric" data-bind="a.goal" data-other="1" value="${custom}" placeholder="Another number" aria-label="Custom goal" />`;
      }
      case 'verify':
        return `<div class="options">${Object.entries(VERIFY)
          .map(([k, v]) => optBtn('verify', k, `${v.label}<small>${v.d}</small>`, v.emo))
          .join('')}</div>`;
      default:
        return '';
    }
  }
  function optBtn(k, v, label, emo) {
    const on = String(W().a[k]) === String(v);
    return `<button class="opt" data-action="w-pick" data-k="${k}" data-v="${esc(v)}" aria-pressed="${on}"><span class="emo" aria-hidden="true">${emo}</span><span class="txt">${label}</span><span class="tick">${on ? ic('check', 14, 3.2) : ''}</span></button>`;
  }

  function ringHTML(s) {
    const r = 27, c = 2 * Math.PI * r;
    const col = s >= 88 ? '#526344' : s >= 50 ? '#8B6B37' : '#B4492F';
    return `<div class="ring"><svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="${r}" fill="none" stroke="#E6E9DF" stroke-width="7"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - s / 100)}"/></svg><b>${s}</b></div>`;
  }
  function checklistHTML() {
    const a = W().a;
    return `<ul class="checklist">${RULES.map(([, l, f]) => `<li class="${f(a) ? 'pass' : ''}"><span class="ck">${ic(f(a) ? 'check' : 'plus', 12, 3.2)}</span>${l}</li>`).join('')}</ul>`;
  }
  function scoreHTML() {
    const s = score();
    return `<div class="score">${ringHTML(s)}<div><h3>${s >= 88 ? 'Ready to publish' : s >= 50 ? 'Almost there' : 'Keep going'}</h3><p>The writing check runs the same rules for everyone. It is a guide, not a gate.</p></div></div>`;
  }
  function miniCardHTML(a) {
    const t = TOPICS[a.topic];
    const img = t ? t.img : 'crosswalk';
    return `<div class="mini-card"><img src="${photo(img)}" alt="" /><div class="card-scrim"></div>
      <span class="illus">Illustrative photo · add your own</span>
      <div class="mc-body">
        <div class="ci-kicker">${t ? `<span class="topic-dot" style="--c:${t.color}"></span>${esc(a.topic)}` : 'Topic'}${a.place ? ` · ${esc(a.place)}` : ''}</div>
        <h3>${esc(a.title || 'Your petition title')}</h3>
        <div class="ci-progress"><div class="progress"><i style="width:0%"></i></div><span><b>0</b> of ${fmt(a.goal || 0)} signed</span></div>
        ${a.recipient ? `<div class="ci-to">${ic('landmark', 16)}To ${esc(a.recipient)}</div>` : ''}
      </div></div>`;
  }
  function writeReviewMobile() {
    const a = W().a;
    const show = (q) => {
      const v = a[q.k];
      if (q.k === 'goal') return v ? `${fmt(v)} signatures` : '';
      if (q.k === 'verify') return v ? VERIFY[v].label : '';
      return v;
    };
    return `<div class="write">${writeTop(true, 'Review')}
      <div class="w-body" style="padding-top:16px">
        ${miniCardHTML(a)}
        <div style="margin-top:16px">${scoreHTML()}</div>
        ${checklistHTML()}
        <div class="answers">${QS.map(
          (q, i) => `<button class="answer" data-action="w-goto" data-step="${i}"><span style="flex:1;min-width:0"><span class="k">${i + 1}. ${esc(q.q)}</span><span class="v ${show(q) ? '' : 'empty'}">${esc(show(q) || 'Needs an answer')}</span></span><span class="edit">Edit</span></button>`,
        ).join('')}</div>
      </div>
      <div class="w-foot"><button class="btn-primary w-next" data-action="w-publish" ${ready() ? '' : 'disabled'}>Publish petition</button></div>
    </div>`;
  }
  function writeDesktop() {
    const w = W();
    const ok = w.desc.trim().length >= 20;
    return `<div class="write"><div class="wd">
      <div class="wd-form">
        <div class="eyebrow accent">Start a petition</div>
        <h1 class="wd-title">What would you like to change?</h1>
        <p class="wd-sub">Start with AI, or answer the ${QS.length} questions below yourself. Everything stays editable until you publish.</p>
        <section class="wd-ai" aria-labelledby="ai-h">
          <h2 id="ai-h">${ic('sparkle', 24)}Draft it with AI</h2>
          <p class="w-hint" style="margin-top:6px">Describe what's happening and what should change, in your own words.</p>
          <textarea id="w-desc" data-bind="desc" rows="4" placeholder="Type it the way you'd tell a friend…" aria-labelledby="ai-h">${esc(w.desc)}</textarea>
          <div class="wd-ai-row">
            <button class="btn-primary" id="w-go" data-action="w-draft" ${ok ? '' : 'disabled'}>${ic('sparkle', 18)}Draft my petition</button>

          </div>
          ${w.aiFields.size ? `<div class="wd-drafted"><span class="w-tag">${ic('sparkle', 16)}Drafted ${w.aiFields.size} answers</span> from your words. Review each one below.</div>` : ''}
          <p class="w-note">${ic('sparkle', 18)}<span>AI drafts only from your words. It won't invent facts, numbers, names or officials, and it never picks the recipient for you.</span></p>

          (q, i) => `<section class="qblock" aria-labelledby="qd-${q.k}">
            <div class="qn"><span>${String(i + 1).padStart(2, '0')} / ${String(QS.length).padStart(2, '0')}</span>${w.aiFields.has(q.k) ? `<span class="w-tag" style="min-height:0;letter-spacing:0">${ic('sparkle', 14)}Drafted from your words</span>` : valid(q.k) ? `<span class="ok">${ic('check', 16, 3)}</span>` : ''}</div>
            <h3 id="qd-${q.k}">${q.q}</h3>
            <p class="w-hint">${q.hint}</p>
            ${fieldHTML(q, 'desk')}

        ).join('')}
      </div>
      <aside class="wd-side" id="wd-side">${deskSideHTML()}</aside>
    </div></div>`;
  }
  function deskSideHTML() {
    return `<div class="wd-side-label">Live preview</div>${miniCardHTML(W().a)}${scoreHTML()}${checklistHTML()}
      <button class="btn-primary block" data-action="w-publish" ${ready() ? '' : 'disabled'}>Publish petition</button>
      ${ready() ? '' : `<p class="fine center" style="margin:0">Answer all ${QS.length} questions to publish (${answeredCount()}/${QS.length} done).</p>`}`;
  }
  function afterWrite() {
    const f = $('#w-field');
    if (f && f.tagName === 'TEXTAREA') autoGrow(f);
    if (f && !isDesk() && W().stage !== 'intro' && window.matchMedia('(hover: hover)').matches) {
      f.focus({ preventScroll: true });
      const n = f.value.length;
      try {
        f.setSelectionRange(n, n);
      } catch {
        /* number inputs */
      }
    }
  }
  function autoGrow(el) {
    if (!el.classList.contains('w-input')) return;
    el.style.height = 'auto';
    el.style.height = Math.max(el.classList.contains('single') ? 40 : 120, el.scrollHeight) + 'px';
  }
  function refreshWriteLive() {
    const w = W();
    const go = $('#w-go');
    if (go) {
      if (w.stage === 'ai' || (isDesk() && go.dataset.action === 'w-draft')) go.disabled = w.desc.trim().length < 20;
      else if (w.stage === 'q') go.disabled = !valid(QS[w.step].k);
    }
    const cc = $('#w-cc');
    if (cc) cc.textContent = `${w.a.title.length}/80`;
    const side = $('#wd-side');
    if (side) side.innerHTML = deskSideHTML();
  }
  function publish() {
    const a = W().a;
    const t = TOPICS[a.topic];
    const p = {
      id: 'n' + Date.now(),
      title: a.title.trim(),
      action: a.action.trim(),
      summary: a.action.trim(),
      problem: a.problem.trim(),
      topic: a.topic,
      community: a.topic === 'Safer streets' ? 'c1' : a.topic === 'Environment' ? 'c2' : a.topic === 'Accessibility' ? 'c3' : 'c4',
      recipient: a.recipient.trim(),
      count: 0,
      goal: Number(a.goal),
      days: 60,
      verify: a.verify,
      img: t.img,
      city: a.place.includes(',') ? a.place : `${a.place}`,
      mine: true,
      illustrative: true,
    };
    PETITIONS.unshift(p);
    state.write = { stage: 'intro', step: 0, desc: '', aiFields: new Set(), prev: null, a: emptyAnswers(), example: false, dir: 1 };
    state.today++;
    openOverlay({ type: 'published', id: p.id });
  }

  // ───────────────────────── 4. DISCOVER ─────────────────────────
  function discoverList() {
    const q = state.q.trim().toLowerCase();
    return PETITIONS.filter((p) => state.dTopic === 'All' || p.topic === state.dTopic).filter((p) => {
      if (!q) return true;
      const c = comm(p.community);
      return [p.title, p.summary, p.topic, p.city, p.recipient, c.name].join(' ').toLowerCase().includes(q);
    });
  }
  function gridHTML() {
    const list = discoverList();
    if (!list.length)
      return `<div class="empty-dark" style="grid-column:1/-1"><b>No petitions match “${esc(state.q)}”</b>Try a place, a topic or an office, like “library” or “Brookside”.<br/><button class="btn-ghost" data-action="clear-search">Clear search</button></div>`;
    return list
      .map(
        (p, i) => `<button class="tile" data-action="open" data-id="${p.id}" style="animation-delay:${Math.min(i, 10) * 30}ms" aria-label="${esc(p.title)}, ${fmt(p.count)} signed">
        <img src="${photo(p.img)}" alt="" loading="lazy" />
        ${state.signed.has(p.id) ? `<span class="tile-flag signed">${ic('check', 12, 3.2)}Signed</span>` : p.mine ? `<span class="tile-flag">Yours</span>` : p.days <= 30 ? `<span class="tile-flag">${ic('clock', 12, 2.4)}${p.days} days left</span>` : ''}
        <span class="tile-meta"><b>${esc(p.title)}</b><span class="progress"><i style="width:${pct(p)}%"></i></span><span>${TOPICS[p.topic].emoji} ${fmt(p.count)} signed · ${esc(cityShort(p.city))}</span></span>
      </button>`,
      )
      .join('');
  }
  function screenDiscover() {
    return `<div class="discover">
      <div class="disc-head"><div class="disc-head-inner">
        <label class="search">${ic('search', 20)}<span class="sr-only">Search</span><input id="d-search" type="search" data-bind="q" value="${esc(state.q)}" placeholder="Search petitions, places, offices" autocomplete="off" /></label>
        <div class="topic-row" role="group" aria-label="Topics">
          ${['All', ...Object.keys(TOPICS)].map((t) => `<button class="tchip" data-action="d-topic" data-topic="${esc(t)}" aria-pressed="${state.dTopic === t}">${t === 'All' ? '' : TOPICS[t].emoji + ' '}${esc(t)}</button>`).join('')}
        </div></div>
      </div>
      <div class="grid" id="d-grid">${gridHTML()}</div>
    </div>`;
  }

  // ───────────────────────── 5. COMMUNITY ─────────────────────────
  function recommended() {
    const q = state.cq.trim().toLowerCase();
    return COMMUNITIES.filter((c) => !q || [c.name, c.desc, c.topic, c.city].join(' ').toLowerCase().includes(q));
  }
  function recReason(c) {
    if (state.joined.has(c.id) && c.id === 'c1') return 'You started this community';
    if (ME.interests.includes(c.topic)) return `People who follow ${c.topic} near ${cityShort(ME.city)} also joined`;
    return `Members of Riverton students also joined`;
  }
  function recHTML(c) {
    const joined = state.joined.has(c.id);
    const t = TOPICS[c.topic];
    return `<div class="rec">
      <div class="rec-thumb"><img src="${photo(c.img)}" alt="" /></div>
      <div>
        <div class="rec-name">${esc(c.name)} <span title="${esc(c.topic)}" aria-label="${esc(c.topic)}">${t.emoji}</span></div>
        <div class="rec-desc">${esc(c.desc)} · ${fmt(c.members + (joined && c.id !== 'c1' ? 1 : 0))} members · ${esc(c.city)}</div>
        <div class="rec-meta">${ic('trend', 18, 2.2)}<span>${esc(recReason(c))}</span></div>
        ${c.id === 'c1' ? '' : `<button class="join" data-action="join" data-id="${c.id}" aria-pressed="${joined}">${joined ? ic('check', 18, 2.6) + 'Joined' : ic('plus', 20, 2.6) + 'Join'}</button>`}
      </div>
    </div>`;
  }
  function postHTML(post) {
    const c = comm(post.community);
    const p = byId(post.petition);
    const open = state.expanded.has(post.id);
    const supported = state.supported.has(post.id);
    const short = post.text.length > 150 && !open ? post.text.slice(0, 150).replace(/\s+\S*$/, '') : post.text;
    return `<article class="post">
      <div class="post-head">
        <div class="post-logo"><img src="${photo(c.img)}" alt="" /></div>
        <div class="post-who"><b>${esc(c.name)} <span aria-hidden="true">${TOPICS[c.topic].emoji}</span></b>
          <span>${fmt(c.members)} members</span>
          <span>${post.suggested ? 'Suggested for you · ' : ''}${esc(post.kind)} by ${esc(post.author)} · ${post.time}</span></div>
        <button class="icon-btn" data-action="post-more" aria-label="More options" style="color:#5f6670">${ic('more', 24, 2.4)}</button>
      </div>
      <div class="post-body">${esc(short)}${short !== post.text ? `…<button class="more" data-action="expand" data-id="${post.id}">more</button>` : ''}</div>
      <img class="post-img" src="${photo(post.img)}" alt="" loading="lazy" />
      ${p ? `<button class="post-petition" data-action="open" data-id="${p.id}"><img src="${photo(p.img)}" alt="" /><span style="flex:1;min-width:0"><b>${esc(p.title)}</b><span>${fmt(p.count)} of ${fmt(p.goal)} signed · ${p.days} days left</span><span class="progress"><i style="width:${pct(p)}%"></i></span></span>${ic('chevR', 20)}</button>` : ''}
      <div class="post-counts"><span>👏💚 ${post.supports + (supported ? 1 : 0)}</span><span>${post.comments} comments</span></div>
      <div class="post-actions">
        <button data-action="support" data-id="${post.id}" aria-pressed="${supported}">${ic('support', 20)}Support</button>
        <button data-action="comment" data-id="${post.id}">${ic('comment', 20)}Comment</button>
        <button data-action="share-post" data-id="${post.id}">${ic('share', 20)}Share</button>
      </div>
    </article>`;
  }
  function feedHTML() {
    const recs = recommended().filter((c) => c.id !== 'c1');
    const list = state.showMore ? recs : recs.slice(0, 3);
    const q = state.cq.trim().toLowerCase();
    const posts = POSTS.filter((p) => !q || (p.text + comm(p.community).name).toLowerCase().includes(q));
    return `<section aria-labelledby="rec-h"><h2 class="sec-title" id="rec-h">Recommended for you</h2>

  function screenCommunity() {
    const joined = COMMUNITIES.filter((c) => state.joined.has(c.id));

            .map((c) => `<button class="side-item"><img src="${photo(c.img)}" alt="" /><span>${esc(c.name)}<small>${fmt(c.members)} members</small></span></button>`)

            .join('')}</div>
        </aside>
      </div>
    </div>`;
  }

  // ───────────────────────── 6. PROFILE ─────────────────────────
  function levelOf(b) {
    const v = b.value();
    const level = b.tiers.filter((t) => v >= t).length;
    const next = b.tiers[level] ?? b.tiers[b.tiers.length - 1];
    return { v, level, next, max: level >= b.tiers.length };
  }
  let medalSeq = 0;
  function medal(b, level, w = 64) {
    const t = TIERS[level];
    const id = `md${medalSeq++}`;
    return `<svg width="${w}" height="${Math.round(w * 1.19)}" viewBox="0 0 64 76" aria-hidden="true">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${t.a}"/><stop offset="1" stop-color="${t.b}"/></linearGradient></defs>
      <path d="M32 4 57 18.5v29L32 62 7 47.5v-29Z" fill="url(#${id})" stroke="${t.b}" stroke-width="4" stroke-linejoin="round"/>
      <path d="M32 11 51 22v21L32 55 13 43V22Z" fill="#fff" opacity=".22"/>
      <text x="32" y="41" text-anchor="middle" font-size="21" ${level ? '' : 'opacity=".45" style="filter:grayscale(1)"'}>${b.emoji}</text>
      <rect x="9" y="57" width="46" height="16" rx="8" fill="${level ? t.b : '#CDD1C5'}" stroke="#FFFFFF" stroke-width="2.5"/>
      <text x="32" y="68.5" text-anchor="middle" font-size="8.6" font-weight="800" fill="#fff" font-family="Plus Jakarta Sans, system-ui, sans-serif" letter-spacing=".4">${level ? 'LEVEL ' + level : 'LOCKED'}</text>
    </svg>`;
  }
  function chartHTML() {
    const you = [3, 1, 4, 2, 0, 5, 2 + state.today];
    const avg = [1, 1, 2, 1, 1, 2, 1];
    const days = ['W', 'T', 'F', 'S', 'S', 'M', 'T'];
    const top = Math.max(6, Math.ceil(Math.max(...you) / 3) * 3);
    const step = top / 3;
    const Wd = isDesk() ? 620 : 330, H = 190, L = 34, R = 14, T = 14, B = 36;
    const x = (i) => L + (i * (Wd - L - R)) / 6;
    const y = (v) => T + (1 - v / top) * (H - T - B);
    const line = (arr) => arr.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const ticks = [0, step, step * 2, top];
    return `<svg class="chart" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Actions per day this week: you ${you.reduce((s, v) => s + v, 0)}, Riverton average ${avg.reduce((s, v) => s + v, 0)}">
      ${ticks.map((t) => `<line x1="${L}" x2="${Wd - R}" y1="${y(t)}" y2="${y(t)}" stroke="#DDE0D5" stroke-width="1.5"/><text x="${L - 10}" y="${y(t) + 4}" text-anchor="end" font-size="12" font-weight="700" fill="#75786F">${t}</text>`).join('')}
      <polyline points="${line(avg)}" fill="none" stroke="#CDD1C5" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
      ${avg.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="5" fill="#B9BEAF"/>`).join('')}
      <defs><linearGradient id="you-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#899878" stop-opacity=".3"/><stop offset="1" stop-color="#899878" stop-opacity="0"/></linearGradient></defs>
      <polygon points="${x(0)},${y(0)} ${line(you)} ${x(6)},${y(0)}" fill="url(#you-fill)"/>
      <polyline points="${line(you)}" fill="none" stroke="#526344" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
      ${you.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="${i === 6 ? 7 : 5.5}" fill="#526344" stroke="#FFFFFF" stroke-width="2"/>`).join('')}
      ${days.map((d, i) => `<text x="${x(i)}" y="${H - 10}" text-anchor="middle" font-size="13" font-weight="700" fill="${i === 6 ? '#121113' : '#75786F'}">${d}</text>`).join('')}
    </svg>`;
  }
  function profileLeft() {
    const topics = ME.interests.map((t) => `<span class="tt" style="--c:${TOPICS[t].soft}">${TOPICS[t].emoji}</span>`).join('');
    const backers = mine().reduce((s, p) => s + p.count, 0);
    return `<div class="prof-hero">
        <div class="prof-bar"><button class="icon-btn" data-action="qr" aria-label="Share profile">${ic('share', 24, 2.2)}</button><h1>${ME.name}</h1><button class="icon-btn" data-action="settings" aria-label="Settings">${ic('gear', 26, 2)}</button></div>
        <div class="ribbon"><span>ORGANIZER</span></div>
        <div class="prof-avatar">${mayaSvg(null)}</div>
      </div>
      <div class="prof-body">

          <div><div class="v">${fmt(backers)}</div><div class="l">Backers</div></div>
        </div>

  // Signature pad: strokes live in state.sign so going back and forward keeps the drawing.
  function bindSigpad() {
    const cv = $('#sig');
    if (!cv) return;
    const dpr = window.devicePixelRatio || 1;
    const r = cv.getBoundingClientRect();
    cv.width = r.width * dpr;
    cv.height = r.height * dpr;
    const ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.lineWidth = 2.6;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#121113';
    const drawStroke = (s) => {
      ctx.beginPath();
      s.forEach((pt, i) => (i ? ctx.lineTo(pt.x, pt.y) : ctx.moveTo(pt.x, pt.y)));
      ctx.stroke();
    };
    state.sign.strokes.forEach(drawStroke);
    updateSignNav();
    let stroke = null;
    const pos = (e) => {
      const b = cv.getBoundingClientRect();
      return { x: e.clientX - b.left, y: e.clientY - b.top };
    };
    cv.addEventListener('pointerdown', (e) => {
      stroke = [pos(e)];
      state.sign.strokes.push(stroke);
      cv.setPointerCapture(e.pointerId);
    });
    cv.addEventListener('pointermove', (e) => {
      if (!stroke) return;
      const p = pos(e);
      const last = stroke[stroke.length - 1];
      if (Math.hypot(p.x - last.x, p.y - last.y) < 2) return;
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      stroke.push(p);
      updateSignNav();
    });
    const stop = () => (stroke = null);
    cv.addEventListener('pointerup', stop);
    cv.addEventListener('pointercancel', stop);
  }

      } else if (w.stage === 'q') {
        if (w.step > 0) w.step--;
        else w.stage = w.aiFields.size ? 'ai' : 'intro';
      }
      render();
    },
    'w-next'() {
      const w = W();
      if (!valid(QS[w.step].k)) return;
      w.example = false;
      w.dir = 1;
      if (w.step < QS.length - 1) w.step++;
      else w.stage = 'review';
      render();
      screen.scrollTop = 0;
    },
    'w-goto'(el) {
      const w = W();
      w.stage = 'q';
      w.step = Number(el.dataset.step);
      w.dir = -1;
      render();
    },
    'w-example'() {
      W().example = !W().example;
      render();
    },
    'w-use-example'() {
      const w = W();
      const q = QS[w.step];
      w.a[q.k] = q.example;
      w.example = false;
      render();
    },
    'w-pick'(el) {
      const w = W();
      const k = el.dataset.k;
      w.a[k] = k === 'goal' ? Number(el.dataset.v) : el.dataset.v;
      w.aiFields.delete(k);
      if (k === 'topic' && w.a.recipient) {
        // keep the creator's own recipient; suggestions just change
      }
      render();
    },
    'w-publish'() {
      if (ready()) openOverlay({ type: 'confirm-publish' });
    },
    'w-publish-go': () => publish(),
    'see-published'() {
      state.tab = 'discover';
      state.q = '';
      state.dTopic = 'All';
      closeOverlay();
    },
    // Discover
    'd-topic'(el) {
      state.dTopic = el.dataset.topic;
      $$('.tchip').forEach((b) => b.setAttribute('aria-pressed', b.dataset.topic === state.dTopic));
      $('#d-grid').innerHTML = gridHTML();
    },
    'clear-search'() {
      state.q = '';
      $('#d-search').value = '';
      $('#d-grid').innerHTML = gridHTML();
    },
    // Community
    join(el) {
      const id = el.dataset.id;
      if (state.joined.has(id)) {
        state.joined.delete(id);
        toast(`Left ${comm(id).name}`);
      } else {
        state.joined.add(id);
        state.today++;
        toast(`Welcome to ${comm(id).name}`);
      }
      render();
    },
    'show-more'() {
      state.showMore = !state.showMore;
      $('#c-feed').innerHTML = feedHTML();
    },
    expand(el) {
      state.expanded.add(el.dataset.id);
      $('#c-feed').innerHTML = feedHTML();
    },
    support(el) {
      const id = el.dataset.id;
      state.supported.has(id) ? state.supported.delete(id) : state.supported.add(id);
      $('#c-feed').innerHTML = feedHTML();
    },
    comment(el) {
      openOverlay({ type: 'comment', post: el.dataset.id });
    },
    'share-post'() {
      toast('Post link copied');
    },
    'post-more'() {
      toast('Report or hide options open here');
    },
    messages() {
      toast('Messages: 2 unread from Riverton students organizers');
    },
    // Profile
    'prof-tab'(el) {
      state.profTab = el.dataset.k;
      render();
    },
    badge(el) {
      openOverlay({ type: 'badge', i: Number(el.dataset.i) });
    },
    qr: () => openOverlay({ type: 'qr' }),
    'copy-profile'() {
      try {
        navigator.clipboard?.writeText(`swipe4change://profile/${ME.handle}`).catch(() => {});
      } catch {
        /* ignore */
      }
      toast('Profile link copied');
    },
    settings() {
      toast('Profile and privacy settings open here');
    },
    toast(el) {
      toast(el.dataset.msg);
    },
  };

  function openDetail(id) {
    openOverlay({ type: 'detail', id });
  }
  function sendCheer(text) {
    const p = byId(state.overlay?.id);
    toast(`Sent to the ${comm(p.community).name} discussion`);
    state.myPosts++;
    setTimeout(closeOverlay, 700);
  }

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    const h = H[el.dataset.action];
    if (h) h(el, e);
  });
  document.addEventListener('submit', (e) => {
    const f = e.target.closest('[data-form]');
    if (!f) return;
    e.preventDefault();
    if (f.dataset.form === 'say') {
      const v = $('#say-input').value.trim();
      if (v) sendCheer(v);
    }
    if (f.dataset.form === 'comment') {
      const v = $('#comment-input').value.trim();
      if (!v) return;
      const post = POSTS.find((x) => x.id === f.dataset.id);
      post.comments++;
      state.myPosts++;
      closeOverlay();
      $('#c-feed') && ($('#c-feed').innerHTML = feedHTML());
      toast('Comment posted');
    }
  });
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.id === 'say-input') $('#say-send').disabled = !el.value.trim();
    const bind = el.dataset.bind;
    if (!bind) return;
    if (bind === 'q') {
      state.q = el.value;
      $('#d-grid').innerHTML = gridHTML();
      return;
    }
    if (bind === 'cq') {
      state.cq = el.value;
      $('#c-feed').innerHTML = feedHTML();
      return;
    }
    const w = W();
    if (bind === 'desc') w.desc = el.value;
    else if (bind.startsWith('a.')) {
      const k = bind.slice(2);
      w.a[k] = k === 'goal' ? Number(el.value) || 0 : el.value;
      w.aiFields.delete(k);
      if (el.dataset.other) {
        // typing a custom value clears the preset selection visually
        $$(`[data-action="w-pick"][data-k="${k}"]`).forEach((b) => {
          b.setAttribute('aria-pressed', 'false');
          const tick = b.querySelector('.tick');
          if (tick) tick.innerHTML = '';
        });
      }
    }
    if (el.classList.contains('w-input')) autoGrow(el);
    refreshWriteLive();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && state.overlay) return state.overlay.type === 'sign' && state.sign?.pending ? undefined : closeOverlay();
    const typing = /INPUT|TEXTAREA/.test(document.activeElement?.tagName || '');
    if (typing) {
      if (e.key === 'Enter' && !e.shiftKey && state.tab === 'write' && W().stage === 'q' && document.activeElement.classList.contains('single')) {
        e.preventDefault();
        H['w-next']();
      }
      return;
    }
    if (state.tab !== 'swipe' || state.overlay) return;
    const map = { ArrowLeft: 'skip', ArrowRight: 'sign', ArrowUp: 'save', z: 'undo', Z: 'undo' };
    if (map[e.key]) {
      e.preventDefault();
      act(map[e.key]);
    } else if (e.key === ' ' || e.key === 'ArrowDown') {
      e.preventDefault();
      if (e.key === 'ArrowDown') {
        const id = topId();
        if (id) openDetail(id);
      } else setPage((state.page + 1) % 3);
    }
  });

  // ───────────────────────── responsive sizing + preview frame ─────────────────────────
  // PC layout (sidebar, multi-column screens) on any mouse-and-keyboard window from 720 px, and on
  // any screen from 1024 px. Narrow PC windows get an icon rail instead of the full sidebar. Columns
  // inside each screen follow the content width (window minus sidebar), not the window.
  const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)');
  function measure() {
    const w = app.clientWidth;
    const h = app.clientHeight;
    const s = w >= 1024 || (w >= 720 && finePointer.matches) ? 'desktop' : w >= 640 ? 'tablet' : 'phone';
    const rail = s === 'desktop' && w < 1100 ? '1' : '0';
    const cw = s === 'desktop' ? w - (rail === '1' ? 88 : 248) : w;
    const flags = {
      size: s,
      rail,
      mid: s === 'desktop' && cw >= 760 ? '1' : '0',
      wide: s === 'desktop' && cw >= 1000 ? '1' : '0',
      xwide: s === 'desktop' && cw >= 1180 ? '1' : '0',
    };
    // Compact swipe card for short or narrow phones (320 × 568) and short PC windows.
    app.dataset.compact = (s === 'phone' && (h < 700 || w < 360)) || (s !== 'phone' && h < 680) ? '1' : '0';
    const changed = Object.entries(flags).some(([k, v]) => app.dataset[k] !== v);
    if (changed) {
      Object.assign(app.dataset, flags);
      render();
      if (state.overlay) renderOverlay();
    }
  }
  finePointer.addEventListener?.('change', measure);
  new ResizeObserver(measure).observe(app);
  const vv = window.visualViewport;
  if (vv) {
    const setVV = () => {
      if (stage.dataset.frame !== 'phone') document.documentElement.style.setProperty('--vvh', vv.height + 'px');
      else document.documentElement.style.removeProperty('--vvh');
    };
    vv.addEventListener('resize', setVV);
    setVV();
  }
  function setFrame(mode) {
    stage.dataset.frame = mode;
    $$('.preview-toggle button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.frame === mode));
    store.set('s4c-frame', mode);
    if (mode === 'phone') document.documentElement.style.removeProperty('--vvh');
    else if (vv) document.documentElement.style.setProperty('--vvh', vv.height + 'px');
    measure();
  }
  $$('.preview-toggle button').forEach((b) => b.addEventListener('click', () => setFrame(b.dataset.frame)));
  const params = new URLSearchParams(location.search);
  if (params.get('tab') && SCREENS[params.get('tab')]) state.tab = params.get('tab');
  const hashTab = location.hash.slice(1);
  if (SCREENS[hashTab]) state.tab = hashTab;
  const startFrame = params.get('frame') || store.get('s4c-frame') || 'off';
  stage.dataset.frame = startFrame === 'phone' && window.innerWidth >= 760 ? 'phone' : 'off';
  $$('.preview-toggle button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.frame === stage.dataset.frame));
  app.dataset.size = '';
  measure();
})();

</script>
