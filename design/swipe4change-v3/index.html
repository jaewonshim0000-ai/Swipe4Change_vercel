<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Swipe4Change v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet" />
<style>
/* Swipe4Change v3 — one visual system for every section, in the original Swipe4Change palette.
   Light sage canvas, near-black olive for primary buttons / tab bar / sidebar, one olive-sage accent
   (sign / progress / selected / AI), muted semantic colors (terracotta = skip & alerts,
   slate blue = saved, muted metals = badge levels). Every screen is built from the
   same parts: pill, search field, card, button, section label, sheet, progress bar.
   Layout size comes from #app[data-size] (phone < 640 ≤ tablet < 1024 ≤ desktop), set by app.js. */

:root {
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

  /* Surfaces — the original Swipe4Change civic palette (src/components/theme.ts) */
  --bg: #eef0e9; /* canvas */
  --bg-1: #f4f5f0; /* quiet */
  --surface: #ffffff;
  --surface-2: #f2f3ee; /* field */
  --surface-3: #e6e9df; /* track */
  --line: #dde0d5;
  --line-2: #cdd1c5;
  --dark: #1c1f19; /* near-black olive: primary buttons, tab bar, sidebar */

  /* Text */
  --text: #121113;
  --text-2: #3e423a;
  --text-3: #5d6259;

  /* The one accent: olive / sage */
  --lime: #526344; /* accent text, selected, checks */
  --green: #526344;
  --sage: #899878;
  --pale: #e4e6c3; /* accent on dark and on photos */
  --on-green: #ffffff;
  --grad-sign: linear-gradient(180deg, #2b3027 0%, #1c1f19 100%);
  --grad-bar: linear-gradient(90deg, #899878, #526344);
  --lime-soft: #eaf0e3;
  --lime-line: #899878;
  --glow: radial-gradient(90% 60% at 50% -12%, rgba(228, 230, 195, 0.95), rgba(228, 230, 195, 0) 70%);
  --shadow-card: 0 10px 26px -16px rgba(32, 38, 26, 0.35);

  /* Semantic */
  --pink: #b4492f; /* skip, alerts */
  --blue: #405e82; /* saved */

  --r-s: 10px;
  --r-m: 16px;
  --r-l: 20px;
  --r-xl: 32px;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --tab-h: 68px;
  --nav-space: calc(var(--tab-h) + 24px + var(--safe-bottom));
  color-scheme: light;
}

* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button,
input,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  border: 0;
  background: none;
  padding: 0;
}
button:disabled {
  cursor: default;
}
img {
  display: block;
}
:focus-visible {
  outline: 3px solid #385d88;
  outline-offset: 2px;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
.ic {
  flex: none;
  display: block;
}

/* ───────────────────────── Stage / device / preview frame ───────────────────────── */
.stage {
  position: relative;
  height: 100%;
}
.device {
  position: relative;
  width: 100%;
  height: var(--vvh, 100dvh);
  overflow: hidden;
}
.statusbar,
.home-ind {
  display: none;
}
.stage[data-frame='phone'] {
  display: grid;
  place-items: center;
  min-height: 100vh;
  padding: 32px 16px;
  background: radial-gradient(80% 60% at 50% 0%, #f4f5f0 0%, #d3d7cb 75%);
}
.stage[data-frame='phone'] .device {
  width: 390px;
  height: 844px;
  border-radius: 56px;
  border: 12px solid #1b1b1e;
  box-shadow:
    0 0 0 2px #34343a,
    0 40px 80px -20px rgba(0, 0, 0, 0.8);
  box-sizing: content-box;
  --safe-top: 47px;
  --safe-bottom: 20px;
}
.stage[data-frame='phone'] .statusbar {
  display: flex;
  position: absolute;
  z-index: 90;
  top: 0;
  left: 0;
  right: 0;
  height: 47px;
  padding: 16px 30px 0 44px;
  justify-content: space-between;
  align-items: center;
  font-weight: 700;
  font-size: 16px;
  pointer-events: none;
  color: var(--sb, #121113);
  fill: currentColor;
}
.sb-icons {
  display: flex;
  gap: 6px;
  align-items: center;
}
.stage[data-frame='phone'] .home-ind {
  display: block;
  position: absolute;
  z-index: 90;
  bottom: 8px;
  left: 50%;
  width: 134px;
  height: 5px;
  margin-left: -67px;
  border-radius: 3px;
  background: var(--sb, #121113);
  opacity: 0.85;
  pointer-events: none;
}
.preview-toggle {
  display: none;
}
@media (min-width: 760px) and (hover: hover) {
  .preview-toggle {
    display: flex;
    position: fixed;
    z-index: 200;
    bottom: 12px;
    right: 12px;
    padding: 4px;
    gap: 4px;
    border-radius: 999px;
    background: rgba(31, 31, 34, 0.9);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line-2);
    box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
    opacity: 0.55;
    transition: opacity 0.2s;
  }
  .preview-toggle:hover,
  .preview-toggle:focus-within {
    opacity: 1;
  }
  .preview-toggle button {
    height: 28px;
    padding: 0 12px;
    border-radius: 999px;
    color: rgba(255, 255, 255, 0.78);
    font-size: 12px;
    font-weight: 700;
  }
  .preview-toggle button[aria-pressed='true'] {
    background: #fff;
    color: #000;
  }
}

/* ───────────────────────── Shared parts ───────────────────────── */
.app {
  position: absolute;
  inset: 0;
  display: flex;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
}
.app[data-size='desktop'] {
  --nav-space: 0px;
}
.main {
  position: relative;
  flex: 1;
  min-width: 0;
}
.screen {
  position: absolute;
  inset: 0;
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: var(--surface-3) transparent;
}
.screen.no-scroll {
  overflow: hidden;
}

/* Section label — the one eyebrow style used on every screen */
.eyebrow,
.p-sec,
.wd-side-label,
.sec-title {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
}
.eyebrow.accent {
  color: var(--lime);
}

/* Pill — topic chips and segmented controls */
.pill,
.tchip,
.seg button {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 40px;
  padding: 0 16px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--text-2);
  font-size: 15px;
  font-weight: 700;
  white-space: nowrap;
  transition:
    background 0.18s,
    color 0.18s;
}
.pill:hover,
.tchip:hover,
.seg button:hover {
  color: var(--text);
}
.pill[aria-pressed='true'],
.tchip[aria-pressed='true'],
.seg button[aria-pressed='true'] {
  background: var(--dark);
  border-color: var(--dark);
  color: #fff;
}

/* Search field — Discover and Community */
.search {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 44px;
  padding: 0 16px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--text-3);
  min-width: 0;
}
.search input {
  flex: 1;
  min-width: 0;
  height: 100%;
  border: 0;
  outline: 0;
  background: none;
  font-size: 16px;
  color: var(--text);
}
.search input::placeholder {
  color: var(--text-3);
}
.search:focus-within {
  border-color: var(--line-2);
  color: var(--text-2);
}

/* Card */
.card-box,
.side-box,
.score,
.answers,
.ov,
.badges,
.qblock,
.opt-card,
.resume,
.post {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  box-shadow: var(--shadow-card);
}

/* Buttons */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 56px;
  padding: 0 24px;
  border-radius: 18px;
  background: var(--grad-sign);
  color: var(--on-green);
  font-size: 16px;
  font-weight: 800;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.12),
    0 12px 26px -14px rgba(32, 38, 26, 0.6);
  transition:
    transform 0.15s,
    filter 0.15s,
    opacity 0.2s;
}
.btn-primary:hover:not(:disabled) {
  filter: brightness(1.05);
}
.btn-primary:active:not(:disabled) {
  transform: scale(0.98);
}
.btn-primary:disabled {
  background: var(--surface-3);
  color: var(--text-3);
  box-shadow: none;
}
.btn-primary.block {
  width: 100%;
}
.btn-ghost {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 48px;
  padding: 0 18px;
  border-radius: 16px;
  font-size: 15px;
  font-weight: 700;
  color: var(--text-2);
}
.btn-ghost:hover {
  background: var(--surface-2);
  color: var(--text);
}
.btn-outline,
.btn-square {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 56px;
  min-width: 56px;
  padding: 0 16px;
  border-radius: 18px;
  border: 1px solid var(--line-2);
  background: var(--surface);
  color: var(--text);
  font-size: 15px;
  font-weight: 700;
}
.btn-outline:hover,
.btn-square:hover {
  background: var(--surface-2);
}
.btn-outline[aria-pressed='true'] {
  border-color: var(--blue);
  color: var(--blue);
  background: #e6edf7;
}
.icon-btn {
  width: 44px;
  height: 44px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: var(--text);
  position: relative;
}
.icon-btn:hover {
  background: rgba(18, 17, 19, 0.06);
}
.dot-badge {
  position: absolute;
  top: 9px;
  right: 9px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--pink);
  border: 2px solid #fff;
}
.tab-badge,
.msg-btn .count {
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 10px;
  background: var(--pink);
  color: #fff;
  font-size: 11px;
  line-height: 20px;
  font-weight: 800;
  text-align: center;
}

/* Progress bar — the same bar everywhere (petitions, badges, write, celebration) */
.progress {
  display: block;
  height: 8px;
  border-radius: 4px;
  background: var(--surface-3);
  overflow: hidden;
}
.progress i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--grad-bar);
  transition: width 0.8s var(--ease);
}
.topic-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--c, var(--green));
  flex: none;
}
.avatar {
  flex: none;
  border-radius: 50%;
  overflow: hidden;
  background: var(--pale);
  display: grid;
  place-items: center;
}
.avatar svg {
  width: 100%;
  height: 100%;
}
.initials {
  flex: none;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #fff;
  font-weight: 800;
}

/* Floating tab bar (phone + tablet) */
.tabbar {
  position: absolute;
  z-index: 30;
  left: 50%;
  bottom: calc(12px + var(--safe-bottom));
  transform: translateX(-50%);
  width: min(560px, calc(100% - 24px));
  height: var(--tab-h);
  display: flex;
  align-items: stretch;
  padding: 6px;
  gap: 2px;
  border-radius: 34px;
  background: rgba(28, 31, 25, 0.95);
  border: 1px solid rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  box-shadow: 0 18px 36px -12px rgba(18, 20, 15, 0.55);
  transition:
    transform 0.35s var(--ease),
    opacity 0.25s;
}
.app[data-size='desktop'] .tabbar,
.app[data-focus='1'] .tabbar {
  transform: translate(-50%, 140%);
  opacity: 0;
  pointer-events: none;
}
.tab {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border-radius: 28px;
  font-size: 12px;
  font-weight: 700;
  color: #9ea393;
  position: relative;
  transition:
    background 0.2s,
    color 0.2s;
}
.tab[aria-current='page'] {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
}
.tab[aria-current='page'] .ic {
  color: var(--pale);
}
.tab-badge {
  position: absolute;
  top: 4px;
  left: calc(50% + 6px);
}

/* Desktop sidebar */
.sidebar {
  display: none;
}
.app[data-size='desktop'] .sidebar {
  display: flex;
  flex-direction: column;
  width: 248px;
  flex: none;
  padding: 24px 16px;
  gap: 4px;
  background: var(--dark);
  color: #fff;
  z-index: 20;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 8px 24px;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.brand-mark {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  background: var(--pale);
  color: var(--dark);
}
.side-link {
  display: flex;
  align-items: center;
  gap: 14px;
  height: 48px;
  padding: 0 14px;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 600;
  color: #c9cebf;
  text-align: left;
}
.side-link:hover {
  background: rgba(255, 255, 255, 0.06);
  color: #fff;
}
.side-link[aria-current='page'] {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
}
.side-link[aria-current='page'] .ic {
  color: var(--pale);
}
.side-cta {
  margin: 20px 0 0;
  background: var(--pale);
  color: var(--dark);
  box-shadow: none;
}
.side-me {
  margin-top: auto;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px;
  border-radius: 16px;
  text-align: left;
}
.side-me:hover {
  background: rgba(255, 255, 255, 0.06);
}
.side-me b {
  display: block;
  font-size: 14px;
}
.side-me span {
  font-size: 12px;
  color: #c9cebf;
}

/* Narrow PC windows: icon rail */
.app[data-rail='1'] .sidebar {
  width: 88px;
  padding: 20px 8px;
  align-items: center;
}
.app[data-rail='1'] .brand {
  padding: 0 0 20px;
}
.app[data-rail='1'] .brand-name,
.app[data-rail='1'] .side-cta .lbl,
.app[data-rail='1'] .me-txt {
  display: none;
}
.app[data-rail='1'] .side-link {
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  width: 72px;
  height: 60px;
  padding: 0;
  font-size: 11px;
  font-weight: 700;
}
.app[data-rail='1'] .side-cta {
  width: 56px;
  height: 56px;
  padding: 0;
}
.app[data-rail='1'] .side-me {
  padding: 6px;
}

/* ───────────────────────── 1. SWIPE ───────────────────────── */
.swipe {
  position: absolute;
  inset: 0 0 var(--nav-space) 0;
  display: flex;
  flex-direction: column;
}
.deck-wrap {
  position: relative;
  flex: 1;
  min-height: 0;
}
.deck {
  position: absolute;
  inset: 0;
}
.card {
  position: absolute;
  inset: 0;
  border-radius: 0 0 var(--r-xl) var(--r-xl);
  overflow: hidden;
  background: var(--surface);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
  will-change: transform;
  box-shadow: 0 24px 44px -24px rgba(32, 38, 26, 0.6);
}
.card:active {
  cursor: grabbing;
}
.card.is-next {
  transform: scale(0.95) translateY(10px);
  filter: brightness(0.55);
  transition:
    transform 0.35s var(--ease),
    filter 0.35s;
  pointer-events: none;
}
.card.is-enter {
  animation: cardIn 0.42s var(--ease);
}
.card.is-undo {
  animation: cardUndo 0.45s var(--ease);
}
@keyframes cardIn {
  from {
    transform: scale(0.95) translateY(10px);
    filter: brightness(0.55);
  }
}
@keyframes cardUndo {
  from {
    transform: translate(-120%, -20px) rotate(-18deg);
  }
}
.card-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
  transition:
    transform 0.6s var(--ease),
    filter 0.4s;
}
.card[data-page='1'] .card-img {
  transform: scale(1.12) translateY(-3%);
}
.card[data-page='2'] .card-img {
  transform: scale(1.22) translateY(-6%);
  filter: saturate(0.85);
}
.card-scrim {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    180deg,
    rgba(0, 0, 0, 0.35) 0%,
    rgba(0, 0, 0, 0) 20%,
    rgba(0, 0, 0, 0) 36%,
    rgba(0, 0, 0, 0.6) 58%,
    rgba(0, 0, 0, 0.9) 82%,
    rgba(0, 0, 0, 0.96) 100%
  );
}
.card[data-page='1'] .card-scrim,
.card[data-page='2'] .card-scrim {
  background: linear-gradient(
    180deg,
    rgba(0, 0, 0, 0.35) 0%,
    rgba(0, 0, 0, 0.1) 20%,
    rgba(0, 0, 0, 0.55) 45%,
    rgba(0, 0, 0, 0.94) 72%,
    #000 100%
  );
}
.segs {
  position: absolute;
  z-index: 3;
  top: calc(var(--safe-top) + 12px);
  left: 50%;
  transform: translateX(-50%);
  width: 132px;
  display: flex;
  gap: 4px;
}
.segs i {
  flex: 1;
  height: 4px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.35);
}
.segs i.on {
  background: #fff;
}
.stamp {
  position: absolute;
  z-index: 4;
  top: calc(var(--safe-top) + 64px);
  padding: 4px 14px;
  border: 5px solid currentColor;
  border-radius: 12px;
  font-size: 40px;
  font-weight: 800;
  letter-spacing: 0.04em;
  opacity: 0;
  pointer-events: none;
}
.stamp-sign {
  left: 24px;
  color: var(--pale);
  transform: rotate(-16deg);
}
.stamp-skip {
  right: 24px;
  color: #ffb4a2;
  transform: rotate(16deg);
}
.stamp-save {
  left: 50%;
  top: 42%;
  color: #b9cde6;
  transform: translateX(-50%) rotate(-8deg);
}
.card-info {
  position: absolute;
  z-index: 2;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 0 16px 112px;
  color: #fff;
}
.ci-kicker {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 600;
  color: #e1e4da;
  margin-bottom: 6px;
}
.ci-title-row {
  display: flex;
  align-items: flex-end;
  gap: 12px;
}
.ci-title {
  flex: 1;
  min-width: 0;
  margin: 0;
  font-size: 30px;
  line-height: 1.1;
  font-weight: 800;
  letter-spacing: -0.025em;
  text-shadow: 0 2px 18px rgba(0, 0, 0, 0.35);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.ci-open {
  flex: none;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #fff;
  background: rgba(0, 0, 0, 0.35);
  border: 1.5px solid rgba(255, 255, 255, 0.75);
}
.ci-open:hover {
  background: rgba(255, 255, 255, 0.15);
}
.ci-progress {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
  font-size: 14px;
  color: #e1e4da;
}
.ci-progress .progress {
  flex: 0 0 88px;
  height: 6px;
  background: rgba(255, 255, 255, 0.24);
}
.ci-progress b {
  color: #fff;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 38px;
  padding: 0 16px;
  border-radius: 999px;
  background: rgba(28, 31, 25, 0.78);
  font-size: 16px;
  font-weight: 500;
  color: #fff;
  white-space: nowrap;
}
.ok {
  color: var(--lime);
}
.chip .ok {
  color: var(--pale);
}
.ci-page {
  margin-top: 12px;
  animation: fadeUp 0.3s var(--ease);
}
.ci-label {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--pale);
  margin-bottom: 6px;
}
.ci-text {
  margin: 0;
  font-size: 16px;
  line-height: 1.5;
  color: rgba(255, 255, 255, 0.9);
  display: -webkit-box;
  -webkit-line-clamp: 5;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.ci-ask {
  margin: 0;
  font-size: 20px;
  line-height: 1.35;
  font-weight: 700;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.ci-to {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  font-size: 14px;
  color: #e1e4da;
}
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
}
/* Compact card for short / narrow phones */
.app[data-compact='1'] .card-info {
  padding-bottom: 96px;
}
.app[data-compact='1'] .ci-title {
  font-size: 24px;
}
.app[data-compact='1'] .ci-kicker {
  font-size: 13px;
  margin-bottom: 4px;
}
.app[data-compact='1'] .ci-progress {
  margin-top: 8px;
  font-size: 13px;
}
.app[data-compact='1'] .ci-progress .progress {
  flex-basis: 56px;
}
.app[data-compact='1'] .ci-progress .long {
  display: none;
}
.app[data-compact='1'] .chips {
  gap: 6px;
  margin-top: 8px;
}
.app[data-compact='1'] .chip {
  height: 32px;
  padding: 0 12px;
  gap: 6px;
  font-size: 14px;
}
.app[data-compact='1'] .ci-text {
  -webkit-line-clamp: 4;
  font-size: 15px;
}
.app[data-compact='1'] .ci-ask {
  font-size: 18px;
  -webkit-line-clamp: 3;
}
.app[data-compact='1'] .act {
  width: 50px;
  height: 50px;
}
.app[data-compact='1'] .act.lg {
  width: 62px;
  height: 62px;
}
.app[data-compact='1'] .actions {
  bottom: 14px;
}
.app[data-compact='1'] .segs {
  top: calc(var(--safe-top) + 10px);
}
.actions {
  position: absolute;
  z-index: 9;
  left: 0;
  right: 0;
  bottom: 20px;
  display: flex;
  justify-content: space-evenly;
  align-items: center;
  padding: 0 8px;
  pointer-events: none;
}
.act {
  pointer-events: auto;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #fff;
  border: 1px solid rgba(255, 255, 255, 0.6);
  box-shadow: 0 10px 24px -10px rgba(18, 20, 15, 0.6);
  transition:
    transform 0.16s var(--ease),
    opacity 0.2s;
}
.act.lg {
  width: 70px;
  height: 70px;
}
.act:hover:not(:disabled) {
  transform: scale(1.07);
}
.act:active:not(:disabled) {
  transform: scale(0.9);
}
.act:disabled {
  opacity: 0.4;
}
.act.pulse {
  animation: pulse 0.4s var(--ease);
}
@keyframes pulse {
  50% {
    transform: scale(1.18);
  }
}
.swipe-hints {
  display: none;
}
.deck-empty {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 32px;
  gap: 12px;
  color: var(--text);
  border-radius: 0 0 var(--r-xl) var(--r-xl);
  background:
    radial-gradient(70% 50% at 50% 35%, rgba(228, 230, 195, 0.9) 0%, rgba(228, 230, 195, 0) 70%),
    var(--surface);
}
.deck-empty h2 {
  margin: 8px 0 0;
  font-size: 24px;
  font-weight: 800;
}
.deck-empty p {
  margin: 0 0 8px;
  color: var(--text-2);
  font-size: 16px;
  line-height: 1.5;
  max-width: 300px;
}
.empty-orb {
  width: 88px;
  height: 88px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--lime-soft);
  color: var(--lime);
}

/* Swipe — tablet & desktop */
.app:not([data-size='phone']) .swipe {
  align-items: center;
  padding: 24px 24px calc(var(--nav-space) - 12px);
}
.app:not([data-size='phone']) .deck-wrap {
  width: min(440px, 100%);
  max-height: 780px;
}
.app:not([data-size='phone']) .card,
.app:not([data-size='phone']) .deck-empty {
  border-radius: 24px;
}
.app:not([data-size='phone']) .segs {
  top: 14px;
}
.app:not([data-size='phone']) .stamp {
  top: 64px;
}
.app[data-size='desktop'] .swipe {
  padding-bottom: 16px;
}
.app[data-size='desktop'] .swipe-hints {
  display: flex;
  gap: 16px;
  justify-content: center;
  padding-top: 14px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-3);
}
.swipe-hints kbd {
  display: inline-grid;
  place-items: center;
  min-width: 24px;
  height: 22px;
  padding: 0 6px;
  margin-right: 6px;
  border-radius: 6px;
  background: var(--surface);
  border: 1px solid var(--line-2);
  font: inherit;
  color: var(--text);
}
.swipe-main {
  display: contents;
}

/* ───────────────────────── 2. SIGNED celebration ───────────────────────── */
.celebrate {
  position: absolute;
  inset: 0;
  z-index: 70;
  overflow: hidden;
  outline: none;
  color: #fff;
  background: linear-gradient(180deg, #8c9b7b 0%, #6b7d5c 28%, #3e4a34 56%, #252a20 80%, #1c1f19 100%);
  animation: celebIn 0.45s var(--ease);
}
@keyframes celebIn {
  from {
    opacity: 0;
    transform: scale(1.04);
  }
}
.celeb-hearts {
  position: absolute;
  left: 50%;
  top: calc(var(--safe-top) - 30px);
  width: max(150%, 560px);
  transform: translateX(-50%);
  pointer-events: none;
}
.celeb-hearts .h {
  transform-origin: 300px 170px;
  animation: heartPop 0.7s var(--ease) both;
}
.celeb-hearts .h2 {
  animation-delay: 0.08s;
}
.celeb-hearts .h3 {
  animation-delay: 0.16s;
}
@keyframes heartPop {
  from {
    transform: scale(0.6);
    opacity: 0;
  }
}
.spark {
  animation: twinkle 1.8s ease-in-out infinite;
  transform-box: fill-box;
  transform-origin: center;
}
.spark.s2 {
  animation-delay: 0.6s;
}
@keyframes twinkle {
  50% {
    transform: scale(0.7) rotate(20deg);
    opacity: 0.7;
  }
}
.celeb-inner {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 440px;
  margin: 0 auto;
  padding: calc(var(--safe-top) + 72px) 24px calc(24px + var(--safe-bottom));
  overflow-y: auto;
  scrollbar-width: none;
}
.celeb-close {
  position: absolute;
  z-index: 3;
  top: calc(var(--safe-top) + 12px);
  left: 12px;
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  color: #fff;
  border-radius: 50%;
}
.celeb-close:hover {
  background: rgba(255, 255, 255, 0.12);
}
.pair {
  position: relative;
  display: flex;
  justify-content: center;
  margin-top: 40px;
  animation: pairIn 0.6s 0.15s var(--ease) both;
}
@keyframes pairIn {
  from {
    opacity: 0;
    transform: translateY(16px) scale(0.92);
  }
}
.pair > * {
  width: 168px;
  height: 168px;
  border-radius: 50%;
  border: 5px solid var(--pale);
  overflow: hidden;
  background: var(--pale);
  box-shadow: 0 16px 40px -16px rgba(0, 0, 0, 0.5);
}
.pair > * + * {
  margin-left: -20px;
}
.pair img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.celeb-title {
  position: relative;
  margin-top: -40px;
  text-align: center;
  line-height: 0.95;
  font-style: italic;
  font-weight: 800;
  color: #fff;
  -webkit-text-stroke: 2px #0a0a0a;
  paint-order: stroke fill;
  text-shadow:
    1px 1px 0 #0a0a0a,
    2px 2px 0 #0a0a0a,
    3px 3px 0 #0a0a0a,
    4px 4px 0 #0a0a0a,
    5px 5px 0 #0a0a0a,
    6px 6px 0 #0a0a0a,
    8px 10px 18px rgba(0, 0, 0, 0.35);
  animation: titleIn 0.55s 0.3s cubic-bezier(0.3, 1.5, 0.5, 1) both;
}
@keyframes titleIn {
  from {
    opacity: 0;
    transform: scale(0.6) rotate(-6deg);
  }
}
.celeb-title small {
  display: block;
  text-align: left;
  font-size: 30px;
  letter-spacing: 0.02em;
  margin: 0 0 2px 6px;
}
.celeb-title span {
  display: block;
  font-size: clamp(54px, 17vw, 76px);
  letter-spacing: -0.02em;
}
.celeb-sub {
  margin: 20px 0 0;
  text-align: center;
  font-size: 17px;
  line-height: 1.45;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.95);
  animation: fadeUp 0.5s 0.45s var(--ease) both;
}
.celeb-meter {
  width: 100%;
  margin-top: 16px;
  animation: fadeUp 0.5s 0.5s var(--ease) both;
}
.celeb-meter .progress {
  background: rgba(255, 255, 255, 0.2);
  height: 6px;
}
.celeb-meter .row {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  font-weight: 600;
  color: #e1e4da;
  margin-top: 8px;
}
.say {
  width: 100%;
  margin-top: 32px;
  display: flex;
  align-items: center;
  height: 60px;
  padding: 0 8px 0 20px;
  border-radius: 18px;
  background: #fff;
  border: 1px solid var(--line-2);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  animation: fadeUp 0.5s 0.55s var(--ease) both;
}
.say:focus-within {
  border-color: var(--lime-line);
}
.say input {
  flex: 1;
  min-width: 0;
  height: 100%;
  border: 0;
  outline: 0;
  background: none;
  font-size: 17px;
  color: var(--text);
  caret-color: var(--lime);
}
.say input::placeholder {
  color: var(--text-3);
}
.say button {
  height: 44px;
  padding: 0 14px;
  font-size: 16px;
  font-weight: 800;
  color: var(--lime);
  border-radius: 12px;
}
.say button:disabled {
  color: var(--text-3);
}
.reacts {
  width: 100%;
  display: flex;
  gap: 12px;
  margin-top: 16px;
  animation: fadeUp 0.5s 0.6s var(--ease) both;
}
.reacts button {
  flex: 1;
  height: 56px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.3);
  font-size: 26px;
  transition:
    background 0.15s,
    transform 0.15s;
}
.reacts button:hover {
  background: rgba(255, 255, 255, 0.1);
}
.reacts button:active {
  transform: scale(0.94);
}
.celeb-foot {
  margin-top: auto;
  padding-top: 24px;
  display: flex;
  gap: 8px;
}
.celeb-foot .btn-ghost {
  color: rgba(255, 255, 255, 0.9);
}
.celeb-foot .btn-ghost:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
}
.confetti {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}
.confetti i {
  position: absolute;
  top: -12px;
  width: 8px;
  height: 14px;
  border-radius: 2px;
  opacity: 0.9;
  animation: fall linear forwards;
}
@keyframes fall {
  to {
    transform: translate(var(--dx), 110vh) rotate(var(--r));
    opacity: 0.2;
  }
}

/* ───────────────────────── 3. WRITE ───────────────────────── */
.write {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--glow), var(--bg);
}
.w-top {
  display: grid;
  grid-template-columns: 48px 1fr 48px;
  align-items: center;
  padding: calc(var(--safe-top) + 6px) 8px 6px;
  min-height: calc(var(--safe-top) + 62px);
}
.w-top h1 {
  margin: 0;
  text-align: center;
  font-size: 18px;
  font-weight: 700;
}
.w-count {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-3);
  text-align: center;
}
.w-progress {
  height: 4px;
  margin: 0 20px;
  border-radius: 2px;
  background: var(--surface-3);
  overflow: hidden;
}
.w-progress i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--grad-bar);
  transition: width 0.4s var(--ease);
}
.w-body {
  flex: 1;
  padding: 32px 20px 24px;
  animation: qIn 0.38s var(--ease);
}
@keyframes qIn {
  from {
    opacity: 0;
    transform: translateX(24px);
  }
}
.w-body.back {
  animation-name: qBack;
}
@keyframes qBack {
  from {
    opacity: 0;
    transform: translateX(-24px);
  }
}
.w-link,
.w-tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 32px;
  font-size: 15px;
  font-weight: 700;
  color: var(--lime);
  border-radius: 8px;
}
.w-link:hover {
  text-decoration: underline;
}
.w-q {
  margin: 12px 0 0;
  font-size: 28px;
  line-height: 1.25;
  font-weight: 800;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.w-input {
  display: block;
  width: 100%;
  margin-top: 24px;
  padding: 0;
  border: 0;
  outline: 0;
  resize: none;
  background: transparent;
  font-size: 19px;
  line-height: 1.55;
  color: var(--text);
  caret-color: var(--lime);
  min-height: 120px;
}
.w-input.single {
  min-height: 0;
}
.w-input::placeholder {
  color: rgba(18, 17, 19, 0.34);
}
.w-hint {
  margin: 16px 0 0;
  font-size: 14px;
  line-height: 1.5;
  color: var(--text-3);
}
.w-hint.count {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
.w-note {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin: 24px 0 0;
  padding: 14px 16px;
  border-radius: var(--r-m);
  background: var(--surface);
  border: 1px solid var(--line);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text-2);
}
.w-note svg {
  color: var(--lime);
  margin-top: 2px;
}
.w-example {
  margin-top: 16px;
  padding: 16px;
  border-radius: var(--r-m);
  background: var(--lime-soft);
  border: 1px solid var(--line-2);
  font-size: 15px;
  line-height: 1.5;
  color: var(--text-2);
  animation: fadeUp 0.25s var(--ease);
}
.w-example b {
  display: block;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 4px;
  color: var(--lime);
}
.w-example button {
  margin-top: 10px;
  font-weight: 800;
  color: var(--lime);
  font-size: 14px;
}
.w-foot {
  position: sticky;
  bottom: 0;
  padding: 12px 20px calc(16px + var(--safe-bottom));
  background: linear-gradient(180deg, rgba(238, 240, 233, 0), var(--bg) 30%);
}
.w-next {
  width: 100%;
}
.w-skip {
  display: block;
  margin: 8px auto 0;
  height: 44px;
  padding: 0 16px;
  font-size: 15px;
  font-weight: 700;
  color: var(--text-2);
  border-radius: 12px;
}
.w-skip:hover {
  background: var(--surface-2);
}
.options {
  display: grid;
  gap: 10px;
  margin-top: 24px;
}
.opt {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 60px;
  padding: 12px 16px;
  border-radius: 18px;
  border: 1px solid var(--line-2);
  background: var(--surface);
  font-size: 17px;
  font-weight: 600;
  text-align: left;
  transition:
    border-color 0.15s,
    background 0.15s;
}
.opt:hover {
  background: var(--surface-2);
}
.opt[aria-pressed='true'],
.goal[aria-pressed='true'],
.opt .emo {
  font-size: 22px;
  width: 28px;
  text-align: center;
  flex: none;
}
.opt .txt {
  flex: 1;
  min-width: 0;
}
.opt .txt small {
  display: block;
  margin-top: 2px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-3);
  line-height: 1.4;
}
.opt .tick {
  flex: none;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid var(--line-2);
  display: grid;
  place-items: center;
  color: #fff;
}
.opt[aria-pressed='true'] .tick {
  background: var(--lime);
  border-color: var(--lime);
}
.goal-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 24px;
}
.goal {
  height: 76px;
  border-radius: 18px;
  border: 1px solid var(--line-2);
  background: var(--surface);
  font-size: 24px;
  font-weight: 800;
}
.goal:hover {
  background: var(--surface-2);
}
.goal small {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-3);
}
.goal[aria-pressed='true'] {
  color: var(--lime);
}
.field-other,
.field {
  display: block;
  width: 100%;
  margin-top: 10px;
  min-height: 56px;
  padding: 14px 16px;
  border-radius: var(--r-m);
  border: 1px dashed var(--line-2);
  background: transparent;
  font-size: 16px;
  color: var(--text);
  outline: 0;
  caret-color: var(--lime);
}
.field {
  border-style: solid;
  background: var(--surface-2);
  resize: vertical;
  line-height: 1.5;
}
.field-other::placeholder,
.field::placeholder {
  color: var(--text-3);
}
.field-other:focus,
.field:focus {
  border-style: solid;
  border-color: var(--lime-line);
}
.w-intro {
  padding: 24px 20px calc(var(--nav-space) + 16px);
  animation: fadeUp 0.35s var(--ease);
}
.w-intro .w-q {
  margin-top: 8px;
  font-size: 32px;
}
.opt-card {
  display: flex;
  align-items: center;
  gap: 16px;
  width: 100%;
  margin-top: 16px;
  padding: 20px;
  text-align: left;
  transition:
    transform 0.15s,
    background 0.2s;
}
.opt-card:hover {
  transform: translateY(-1px);
  background: var(--surface-2);
}
.opt-card.ai,
.wd-ai {
  border: 1px solid transparent;
  background:
    linear-gradient(var(--surface), var(--surface)) padding-box,
    linear-gradient(120deg, var(--pale), var(--sage) 50%, var(--green)) border-box;
}
.opt-card.ai:hover {
  background:
    linear-gradient(var(--surface-2), var(--surface-2)) padding-box,
    linear-gradient(120deg, var(--pale), var(--sage) 50%, var(--green)) border-box;
}
.opt-card .orb {
  flex: none;
  width: 52px;
  height: 52px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  background: var(--surface-2);
  color: var(--text);
}
.opt-card.ai .orb {
  background: var(--lime-soft);
  color: var(--lime);
}
.opt-card b {
  display: block;
  font-size: 18px;
  font-weight: 800;
}
.opt-card span {
  display: block;
  margin-top: 4px;
  font-size: 14px;
  line-height: 1.45;
  color: var(--text-3);
}
.opt-card .chev {
  margin-left: auto;
  color: var(--text-3);
}
.resume {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  margin-top: 24px;
  padding: 16px;
  font-size: 15px;
  font-weight: 700;
  text-align: left;
}
.resume:hover {
  background: var(--surface-2);
}
.resume small {
  display: block;
  font-weight: 500;
  color: var(--text-3);
  font-size: 13px;
}
.drafting {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding-top: 64px;
}
.spark-orb {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--on-green);
  background: conic-gradient(from 0deg, var(--pale), var(--sage), var(--green), var(--pale));
  animation: spin 2.4s linear infinite;
  box-shadow: 0 20px 50px -18px rgba(82, 99, 68, 0.7);
}
.spark-orb > * {
  animation: spin 2.4s linear infinite reverse;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
.draft-steps {
  list-style: none;
  margin: 32px 0 0;
  padding: 0;
  display: grid;
  gap: 10px;
  width: min(320px, 100%);
  text-align: left;
}
.draft-steps li {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 48px;
  padding: 0 16px;
  border-radius: 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  font-size: 15px;
  font-weight: 700;
  color: var(--text-3);
}
.draft-steps li .st {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid var(--line-2);
  display: grid;
  place-items: center;
  color: #fff;
  flex: none;
}
.draft-steps li.active,
.draft-steps li.done {
  color: var(--text);
}
.draft-steps li.active .st {
  border-color: var(--lime);
  border-top-color: transparent;
  animation: spin 0.8s linear infinite;
}
.draft-steps li.done .st {
  background: var(--lime);
  border-color: var(--lime);
}
.draft-steps li.skip .st {
  border-style: dashed;
}

/* Review + preview */
.score {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px;
}
.ring {
  position: relative;
  width: 64px;
  height: 64px;
  flex: none;
}
.ring svg {
  transform: rotate(-90deg);
}
.ring b {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 18px;
  font-weight: 800;
}
.score h3 {
  margin: 0;
  font-size: 16px;
  font-weight: 800;
}
.score p {
  margin: 4px 0 0;
  font-size: 13px;
  line-height: 1.45;
  color: var(--text-3);
}
.checklist {
  list-style: none;
  margin: 12px 0 0;
  padding: 0;
  display: grid;
  gap: 2px;
}
.checklist li {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 8px 0;
  font-size: 14px;
  line-height: 1.4;
  color: var(--text-2);
}
.checklist .ck {
  flex: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  margin-top: 1px;
  background: var(--surface-2);
  color: var(--text-3);
}
.checklist li.pass .ck {
  background: var(--lime-soft);
  color: var(--lime);
}
.answers {
  margin-top: 16px;
  overflow: hidden;
}
.answer {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  width: 100%;
  padding: 14px 16px;
  text-align: left;
  border-bottom: 1px solid var(--line);
}
.answer:last-child {
  border-bottom: 0;
}
.answer:hover {
  background: var(--surface-2);
}
.answer .k {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-3);
}
.answer .v {
  margin-top: 2px;
  font-size: 15px;
  line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.answer .v.empty {
  color: var(--pink);
}
.answer .edit {
  margin-left: auto;
  flex: none;
  color: var(--lime);
  font-size: 14px;
  font-weight: 700;
}
.mini-card {
  position: relative;
  border-radius: 24px;
  overflow: hidden;
  aspect-ratio: 3 / 3.6;
  max-width: 100%;
  background: var(--dark);
  color: #fff;
  border: 1px solid var(--line);
  box-shadow: 0 24px 40px -24px rgba(32, 38, 26, 0.6);
}
.mini-card img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.mini-card .card-scrim {
  background: linear-gradient(180deg, rgba(0, 0, 0, 0) 30%, rgba(0, 0, 0, 0.85) 80%, #000 100%);
}
.mini-card .mc-body {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 16px;
}
.mini-card .mc-body h3 {
  margin: 4px 0 0;
  font-size: 22px;
  line-height: 1.15;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.mini-card .mc-body .ci-progress {
  margin-top: 10px;
}
.illus {
  position: absolute;
  top: 12px;
  left: 12px;
  height: 26px;
  padding: 0 10px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.6);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
}

/* Write — tablet: keep the one-question column at a readable width */
.app[data-size='tablet'] .w-top,
.app[data-size='tablet'] .w-progress,
.app[data-size='tablet'] .w-body,
.app[data-size='tablet'] .w-foot,
.app[data-size='tablet'] .w-intro {
  width: 100%;
  max-width: 640px;
  margin-left: auto;
  margin-right: auto;
}
.app[data-size='tablet'] .w-progress {
  width: calc(100% - 40px);
}

/* Write — desktop: every question on one page, live preview on the right */
.wd {
  padding: 40px 32px 64px;
  display: grid;
  grid-template-columns: minmax(0, 680px);
  gap: 32px;
  justify-content: center;
  align-items: start;
}
.app[data-wide='1'] .wd {
  grid-template-columns: minmax(0, 680px) 360px;
  gap: 40px;
}
.wd-title {
  margin: 4px 0 0;
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.025em;
}
.wd-sub {
  margin: 8px 0 0;
  font-size: 16px;
  line-height: 1.5;
  color: var(--text-3);
}
.wd-ai {
  margin-top: 24px;
  padding: 24px;
  border-radius: var(--r-l);
}
.wd-ai h2 {
  margin: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 20px;
  font-weight: 800;
}
.wd-ai h2 svg {
  color: var(--lime);
}
.wd-ai textarea,
.qblock textarea,
.qblock input[type='text'],
.qblock input[type='number'] {
  display: block;
  width: 100%;
  margin-top: 16px;
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px solid var(--line-2);
  background: var(--surface-2);
  color: var(--text);
  font-size: 16px;
  line-height: 1.5;
  outline: 0;
  resize: vertical;
  caret-color: var(--lime);
}
.wd-ai textarea::placeholder,
.qblock textarea::placeholder,
.qblock input::placeholder {
  color: var(--text-3);
}
.wd-ai textarea:focus,
.qblock textarea:focus,
.qblock input:focus {
  border-color: var(--lime-line);
  box-shadow: 0 0 0 4px rgba(82, 99, 68, 0.1);
}
.wd-ai-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 16px;
  flex-wrap: wrap;
}
.wd-ai-row .btn-primary {
  height: 48px;
  border-radius: 14px;
}
.wd-ai .w-note {
  margin-top: 16px;
  background: var(--bg-1);
}
.wd-drafted {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 16px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-2);
}
.qblock {
  margin-top: 16px;
  padding: 24px;
}
.qblock .qn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.08em;
  color: var(--text-3);
}
.qblock h3 {
  margin: 8px 0 0;
  font-size: 20px;
  line-height: 1.3;
  font-weight: 800;
  letter-spacing: -0.01em;
}
.qblock .w-hint {
  margin-top: 8px;
}
.qblock .options,
.qblock .goal-grid {
  margin-top: 16px;
}
.qblock .goal-grid {
  grid-template-columns: repeat(4, 1fr);
}
.qblock .opt {
  min-height: 52px;
  font-size: 15px;
  background: var(--surface-2);
}
.qblock .goal {
  background: var(--surface-2);
}
.wd-side {
  display: grid;
  gap: 16px;
}
.app:not([data-wide='1']) .wd-side .mini-card {
  max-width: 360px;
}
.app[data-wide='1'] .wd-side {
  position: sticky;
  top: 32px;
}

/* ───────────────────────── 4. DISCOVER ───────────────────────── */
.discover {
  min-height: 100%;
  padding-bottom: calc(var(--nav-space) + 8px);
}
.disc-head,
.comm-top {
  position: sticky;
  top: 0;
  z-index: 5;
  padding: calc(var(--safe-top) + 8px) 8px 8px;
  background: rgba(238, 240, 233, 0.9);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
.topic-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  margin-top: 8px;
  padding-bottom: 2px;
}
.topic-row::-webkit-scrollbar {
  display: none;
}
.tchip {
  height: 36px;
  padding: 0 14px;
  font-size: 14px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  padding: 0 8px;
}
.app[data-size='tablet'] .grid {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.app[data-size='desktop'] .grid {
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
  padding: 0 24px;
  max-width: 1560px;
  margin: 0 auto;
}
.app[data-size='desktop'] .disc-head {
  padding: 24px 24px 16px;
}
.app[data-size='desktop'] .disc-head-inner {
  max-width: 1512px;
  margin: 0 auto;
}
.app[data-size='desktop'] .disc-head .search {
  max-width: 720px;
}
.tile {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 4 / 5;
  border-radius: 14px;
  overflow: hidden;
  background: var(--surface-3);
  color: #fff;
  text-align: left;
  box-shadow: var(--shadow-card);
  animation: tileIn 0.45s var(--ease) both;
}
@keyframes tileIn {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
}
.tile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s var(--ease);
}
.tile:hover img {
  transform: scale(1.04);
}
.tile-meta {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 40px 12px 12px;
  background: linear-gradient(180deg, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.82));
}
.tile-meta b {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  font-size: 14px;
  line-height: 1.3;
  font-weight: 700;
}
.tile-meta .progress {
  height: 4px;
  margin-top: 8px;
  background: rgba(255, 255, 255, 0.22);
}
.tile-meta span {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
  font-size: 12px;
  color: #e1e4da;
}
.tile-flag {
  position: absolute;
  top: 10px;
  left: 10px;
  height: 24px;
  padding: 0 9px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  font-size: 11px;
  font-weight: 700;
  color: #fff;
}
.tile-flag.signed {
  background: var(--pale);
  color: var(--dark);
}
.empty-dark {
  padding: 64px 24px;
  text-align: center;
  color: var(--text-2);
  font-size: 16px;
  line-height: 1.5;
}
.empty-dark b {
  display: block;
  color: var(--text);
  font-size: 20px;
  margin-bottom: 6px;
}
.empty-dark .btn-ghost {
  margin-top: 12px;
}

/* ───────────────────────── 5. COMMUNITY ───────────────────────── */
.comm {
  min-height: 100%;
  padding-bottom: calc(var(--nav-space) + 8px);
}
.comm-top {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(var(--safe-top) + 8px) 8px 8px 12px;
}
.comm-top .search {
  flex: 1;
}
.msg-btn .count {
  position: absolute;
  top: 2px;
  right: 0;
  border: 2px solid var(--bg);
  line-height: 16px;
  height: 22px;
  min-width: 22px;
}
.comm-feed {
  display: grid;
  gap: 12px;
  padding: 4px 8px 0;
}
.comm-feed > section {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  overflow: hidden;
}
.sec-title {
  margin: 0;
  padding: 20px 16px 4px;
}
.rec {
  display: grid;
  grid-template-columns: 56px 1fr;
  gap: 14px;
  padding: 16px;
  position: relative;
}
.rec + .rec::before {
  content: '';
  position: absolute;
  top: 0;
  left: 16px;
  right: 16px;
  border-top: 1px solid var(--line);
}
.rec-thumb {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  overflow: hidden;
  background: var(--surface-2);
}
.rec-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.rec-name {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 17px;
  font-weight: 800;
  line-height: 1.3;
}
.rec-desc {
  margin-top: 2px;
  font-size: 15px;
  line-height: 1.4;
  color: var(--text-2);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.rec-meta {
  display: flex;
  gap: 8px;
  margin-top: 6px;
  font-size: 13px;
  line-height: 1.4;
  color: var(--text-3);
}
.rec-meta svg {
  margin-top: 1px;
}
.join {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 44px;
  margin-top: 12px;
  padding: 0 18px 0 14px;
  border-radius: 999px;
  border: 1px solid var(--lime-line);
  background: var(--lime-soft);
  color: var(--lime);
  font-size: 15px;
  font-weight: 800;
  transition: background 0.15s;
}
.join:hover {
  background: var(--pale);
}
.join[aria-pressed='true'] {
  border-color: var(--line-2);
  background: var(--surface-2);
  color: var(--text-2);
}
.show-more {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  height: 56px;
  border-top: 1px solid var(--line);
  font-size: 16px;
  font-weight: 700;
  color: var(--text-2);
}
.show-more:hover {
  background: var(--surface-2);
  color: var(--text);
}
.band {
  display: none;
}
.post {
  padding-top: 16px;
  overflow: hidden;
}
.post-head {
  display: flex;
  gap: 12px;
  padding: 0 16px;
}
.post-logo {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  overflow: hidden;
  flex: none;
}
.post-logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.post-who {
  flex: 1;
  min-width: 0;
}
.post-who b {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 16px;
}
.post-who span {
  display: block;
  font-size: 13px;
  line-height: 1.4;
  color: var(--text-3);
}
.post-body {
  padding: 12px 16px 0;
  font-size: 15px;
  line-height: 1.55;
  color: var(--text);
}
.post-body .more {
  color: var(--text-3);
  font-weight: 700;
}
.post-img {
  margin-top: 12px;
  width: 100%;
  aspect-ratio: 3 / 2;
  object-fit: cover;
}
.post-petition {
  display: flex;
  gap: 12px;
  align-items: center;
  margin: 12px 16px 0;
  padding: 12px;
  border-radius: var(--r-m);
  background: var(--surface-2);
  border: 1px solid var(--line);
  width: calc(100% - 32px);
  text-align: left;
}
.post-petition:hover {
  background: var(--surface-3);
}
.post-img {
  background: var(--surface-3);
}
.post-petition img {
  width: 48px;
  height: 48px;
  border-radius: 10px;
  object-fit: cover;
}
.post-petition b {
  display: block;
  font-size: 15px;
}
.post-petition .progress {
  height: 4px;
  margin-top: 6px;
}
.post-petition span {
  font-size: 13px;
  color: var(--text-3);
}
.post-counts {
  display: flex;
  justify-content: space-between;
  padding: 12px 16px;
  font-size: 13px;
  color: var(--text-3);
}
.post-actions {
  display: flex;
  border-top: 1px solid var(--line);
  padding: 4px 8px;
}
.post-actions button {
  flex: 1;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  color: var(--text-2);
}
.post-actions button:hover {
  background: var(--surface-2);
  color: var(--text);
}
.post-actions button[aria-pressed='true'] {
  color: var(--lime);
}
.comm-side {
  display: none;
}
.app:not([data-size='phone']) .comm-feed {
  max-width: 640px;
  margin: 0 auto;
}
.app[data-size='desktop'] .comm-top {
  padding: 16px 24px;
}
.app[data-size='desktop'] .comm-top .search {
  max-width: 420px;
}
.app[data-size='desktop'] .comm-layout {
  display: grid;
  grid-template-columns: minmax(0, 640px);
  gap: 24px;
  justify-content: center;
  padding: 8px 24px 24px;
  align-items: start;
}
.app[data-mid='1'] .comm-layout {
  grid-template-columns: 240px minmax(0, 600px);
}
.app[data-xwide='1'] .comm-layout {
  grid-template-columns: 240px minmax(0, 600px) 300px;
}
.app[data-size='desktop'] .comm-feed {
  max-width: none;
  margin: 0;
  padding: 0;
}
.app[data-mid='1'] .comm-side {
  display: block;
  position: sticky;
  top: 92px;
}
.app[data-mid='1'] .comm-side.right {
  display: none;
}
.app[data-xwide='1'] .comm-side.right {
  display: block;
}
.side-box {
  overflow: hidden;
}
.side-box + .side-box {
  margin-top: 12px;
}
.me-cover {
  height: 56px;
  background: var(--glow), var(--surface-2);
}
.me-box {
  padding: 0 16px 16px;
  text-align: center;
}
.me-box .avatar {
  margin: -32px auto 0;
  border: 3px solid var(--surface);
}
.me-box b {
  display: block;
  margin-top: 8px;
  font-size: 17px;
}
.me-box span {
  font-size: 13px;
  color: var(--text-3);
}
.side-box h4 {
  margin: 0;
  padding: 16px 16px 8px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
}
.side-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 16px;
  text-align: left;
  font-size: 14px;
  font-weight: 600;
}
.side-item:hover {
  background: var(--surface-2);
}
.side-item img {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  object-fit: cover;
}
.side-item small {
  display: block;
  font-weight: 500;
  color: var(--text-3);
  font-size: 12px;
}
.side-item:last-child {
  margin-bottom: 8px;
}

/* ───────────────────────── 6. PROFILE ───────────────────────── */
.prof {
  min-height: 100%;
  padding-bottom: calc(var(--nav-space) + 16px);
}
.prof-hero {
  position: relative;
  height: calc(var(--safe-top) + 268px);
  overflow: hidden;
  background:
    radial-gradient(60% 70% at 50% 100%, rgba(137, 152, 120, 0.45), rgba(137, 152, 120, 0) 72%),
    linear-gradient(180deg, #e4e6c3 0%, #eaf0e3 100%);
  border-bottom: 1px solid var(--line);
}
.prof-bar {
  position: absolute;
  z-index: 2;
  top: calc(var(--safe-top) + 6px);
  left: 8px;
  right: 8px;
  display: grid;
  grid-template-columns: 48px 1fr 48px;
  align-items: center;
}
.prof-bar h1 {
  margin: 0;
  text-align: center;
  font-size: 20px;
  font-weight: 800;
}
.ribbon {
  position: absolute;
  z-index: 2;
  top: calc(var(--safe-top) + 64px);
  right: 20px;
  height: 28px;
  padding: 0 12px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  transform: skewX(-12deg);
  background: var(--dark);
  box-shadow: 0 6px 16px -6px rgba(32, 38, 26, 0.5);
}
.ribbon span {
  transform: skewX(12deg);
  font-size: 12px;
  font-weight: 800;
  font-style: italic;
  letter-spacing: 0.08em;
  color: var(--pale);
}
.prof-avatar {
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 216px;
  height: 216px;
  transform: translateX(-50%);
  animation: avatarIn 0.6s var(--ease);
}
@keyframes avatarIn {
  from {
    transform: translate(-50%, 24px);
    opacity: 0;
  }
}
.prof-body {
  padding: 24px 20px 0;
}
.handle {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.08em;
  color: var(--text-3);
  text-transform: uppercase;
}
.stats {
  display: grid;
  grid-template-columns: 1.2fr 1fr 1fr;
  gap: 12px;
  margin-top: 16px;
}
.stats .v {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 34px;
  font-size: 24px;
  font-weight: 800;
}
.stats .l {
  margin-top: 2px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-3);
}
.tt {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  font-size: 16px;
  background: var(--c);
}
.btn3d-row {
  display: flex;
  gap: 10px;
  margin-top: 24px;
}
.btn3d-row .btn-primary {
  flex: 1;
}
.p-sec {
  margin: 36px 0 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.p-sec small {
  font-size: 12px;
  letter-spacing: 0;
  text-transform: none;
  font-weight: 700;
}
.chart-box {
  padding: 16px 16px 18px;
}
.chart {
  width: 100%;
  height: auto;
  display: block;
}
.chart text {
  font-family: var(--font);
}
.legend {
  margin-top: 14px;
  display: grid;
  gap: 10px;
}
.legend div {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 15px;
  font-weight: 700;
}
.legend i {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  flex: none;
}
.legend span {
  margin-left: auto;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}
.overview {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.ov {
  padding: 14px 16px;
}
.ov-top {
  display: flex;
  align-items: center;
  gap: 10px;
}
.ov .e {
  font-size: 20px;
  line-height: 1;
}
.ov b {
  font-size: 22px;
  font-weight: 800;
}
.ov > span {
  display: block;
  margin-top: 4px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-3);
}
.badges {
  overflow: hidden;
}
.badge {
  display: grid;
  grid-template-columns: 56px 1fr;
  gap: 16px;
  align-items: center;
  width: 100%;
  padding: 16px;
  text-align: left;
  border-bottom: 1px solid var(--line);
  transition: background 0.15s;
}
.badge:last-child {
  border-bottom: 0;
}
.badge:hover {
  background: var(--surface-2);
}
.badge .b-name {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 16px;
  font-weight: 800;
}
.badge .b-name small {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--tc, var(--text-3));
  white-space: nowrap;
}
.badge .b-desc {
  margin-top: 2px;
  font-size: 13px;
  line-height: 1.4;
  color: var(--text-3);
}
.b-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
}
.b-bar .progress {
  flex: 1;
}
.b-bar span {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-3);
  min-width: 44px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.ladder {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 16px;
}
.ladder div {
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-3);
}
.ladder svg {
  margin: 0 auto 6px;
}
.seg {
  display: flex;
  gap: 6px;
}
.seg button {
  flex: 1;
}
.act-list {
  margin-top: 8px;
}
.act-row {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 12px 0;
  text-align: left;
  border-bottom: 1px solid var(--line);
}
.act-row:last-child {
  border-bottom: 0;
}
.act-row img {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  object-fit: cover;
  flex: none;
}
.act-row b {
  display: block;
  font-size: 15px;
}
.act-row span {
  display: block;
  margin-top: 2px;
  font-size: 13px;
  color: var(--text-3);
}
.act-row .progress {
  margin-top: 8px;
  height: 4px;
}
.act-row .grow {
  flex: 1;
  min-width: 0;
}
.act-empty {
  padding: 20px 0;
  font-size: 14px;
  line-height: 1.5;
  color: var(--text-3);
}
.app:not([data-size='phone']) .prof-wrap {
  max-width: 640px;
  margin: 0 auto;
}
.app[data-size='desktop'] .prof-wrap {
  max-width: 688px;
  padding: 32px 24px;
}
.app[data-size='desktop'] .prof-right .prof-body {
  padding-top: 8px;
}
.app[data-wide='1'] .prof-wrap {
  max-width: 1080px;
  display: grid;
  grid-template-columns: 360px minmax(0, 1fr);
  gap: 32px;
  padding: 32px;
  align-items: start;
}
.app[data-wide='1'] .prof-left {
  position: sticky;
  top: 32px;
}
.app[data-size='desktop'] .prof-left {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  overflow: hidden;
  padding-bottom: 24px;
}
.app[data-size='desktop'] .prof-hero {
  height: 268px;
  --safe-top: 0px;
}
.app[data-wide='1'] .prof-right .prof-body {
  padding: 0;
}
.app[data-wide='1'] .prof-right .p-sec:first-child {
  margin-top: 4px;
}
.app[data-size='desktop'] .chart {
  max-height: 300px;
}

/* ───────────────────────── Sheets, modals, toast ───────────────────────── */
.scrim {
  position: absolute;
  inset: 0;
  z-index: 60;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: rgba(18, 17, 19, 0.45);
  animation: fade 0.2s ease;
}
@keyframes fade {
  from {
    opacity: 0;
  }
}
.sheet {
  position: relative;
  outline: none;
  width: 100%;
  max-height: calc(100% - var(--safe-top) - 24px);
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 28px 28px 0 0;
  padding: 8px 20px calc(20px + var(--safe-bottom));
  animation: sheetUp 0.38s var(--ease);
  box-shadow: 0 -20px 40px -20px rgba(32, 38, 26, 0.45);
  scrollbar-width: none;
}
@keyframes sheetUp {
  from {
    transform: translateY(100%);
  }
}
.app:not([data-size='phone']) .scrim {
  align-items: center;
  padding: 24px;
}
.app:not([data-size='phone']) .sheet {
  width: min(520px, 100%);
  max-height: calc(100% - 48px);
  border-radius: 28px;
  border-bottom: 1px solid var(--line);
  padding: 24px 28px 28px;
  animation: pop 0.3s var(--ease);
}
.app:not([data-size='phone']) .sheet.wide {
  width: min(640px, 100%);
}
@keyframes pop {
  from {
    opacity: 0;
    transform: translateY(12px) scale(0.98);
  }
}
.handle-bar {
  width: 40px;
  height: 5px;
  border-radius: 3px;
  background: var(--line-2);
  margin: 4px auto 12px;
}
.app:not([data-size='phone']) .handle-bar {
  display: none;
}
.sheet-head {
  display: flex;
  align-items: center;
  gap: 12px;
}
.sheet-head img {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  object-fit: cover;
  flex: none;
}
.sheet-head .grow {
  flex: 1;
  min-width: 0;
}
.sheet h2,
.sheet h3 {
  margin: 2px 0 0;
  font-size: 20px;
  line-height: 1.25;
  font-weight: 800;
  letter-spacing: -0.01em;
}
.sheet .close {
  width: 44px;
  height: 44px;
  flex: none;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--surface-2);
  color: var(--text);
}
.sheet .close:hover {
  background: var(--surface-3);
}
.ask-box {
  margin-top: 16px;
  padding: 16px;
  border-radius: var(--r-m);
  background: var(--surface-2);
}
.ask-box p {
  margin: 4px 0 0;
  font-size: 17px;
  line-height: 1.45;
  font-weight: 700;
}
.ask-to {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  font-size: 14px;
  color: var(--text-2);
}
.elig {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin-top: 12px;
  padding: 12px 14px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.45;
  background: var(--lime-soft);
  color: #326544;
}
.elig.warn {
  background: #fbf6ec;
  color: #805c24;
}
.elig.block {
  background: #fbedea;
  color: #ba1a1a;
}
.f-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 20px 0 8px;
  font-size: 15px;
  font-weight: 800;
}
.f-label button {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-3);
  height: 32px;
  padding: 0 8px;
  border-radius: 8px;
}
.f-label button:hover {
  background: var(--surface-2);
  color: var(--text);
}
.seg3 button[aria-pressed='true'] {
  color: var(--lime);
}
.sigpad {
  position: relative;
  height: 128px;
  border-radius: var(--r-m);
  border: 1px dashed var(--line-2);
  background: var(--bg-1);
  touch-action: none;
  overflow: hidden;
}
.sigpad canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  cursor: crosshair;
}
.sigpad .ph {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 28px;
  border-bottom: 1px solid var(--line-2);
  font-size: 13px;
  font-weight: 700;
  color: var(--text-3);
  padding-bottom: 4px;
  pointer-events: none;
}
.sheet-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}
.sheet-actions .btn-primary {
  flex: 1;
}
.detail-hero {
  position: relative;
  margin: -8px -20px 0;
  aspect-ratio: 16 / 11;
  overflow: hidden;
  border-radius: 28px 28px 0 0;
}
.app:not([data-size='phone']) .detail-hero {
  margin: -24px -28px 0;
}
.detail-hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.detail-hero::after {
  content: '';
  position: absolute;
  inset: 50% 0 0;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0), var(--surface));
  pointer-events: none;
}
.detail-hero .close {
  position: absolute;
  z-index: 2;
  top: 12px;
  right: 12px;
  background: rgba(18, 17, 19, 0.55);
  color: #fff;
  backdrop-filter: blur(8px);
}
.detail-hero .illus {
  top: auto;
  bottom: 12px;
  z-index: 2;
}
.d-kicker {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-2);
}
.d-title {
  margin: 6px 0 0;
  font-size: 26px !important;
  line-height: 1.15 !important;
  letter-spacing: -0.02em !important;
}
.d-summary {
  margin: 10px 0 0;
  font-size: 16px;
  line-height: 1.5;
  color: var(--text-2);
}
.d-meter {
  margin-top: 20px;
}
.d-meter .row {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  font-size: 14px;
  color: var(--text-3);
}
.d-meter .row b {
  color: var(--text);
}
.d-rows {
  margin-top: 16px;
  display: grid;
  gap: 2px;
}
.d-row {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 10px 0;
  font-size: 15px;
  line-height: 1.45;
}
.d-row svg {
  color: var(--text-3);
  margin-top: 1px;
}
.d-row small {
  display: block;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-3);
}
.d-problem {
  margin: 8px 0 0;
  font-size: 15px;
  line-height: 1.6;
  color: var(--text-2);
}
.fine {
  margin: 12px 0 0;
  font-size: 12px;
  color: var(--text-3);
}
.d-foot {
  position: sticky;
  bottom: calc(-20px - var(--safe-bottom));
  margin: 20px -20px calc(-20px - var(--safe-bottom));
  padding: 12px 20px calc(16px + var(--safe-bottom));
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), var(--surface) 30%);
  display: flex;
  gap: 10px;
  border-top: 1px solid var(--line);
}
.app:not([data-size='phone']) .d-foot {
  bottom: -28px;
  margin: 20px -28px -28px;
  padding: 16px 28px 20px;
}
.d-foot .btn-primary {
  flex: 1;
}
/* QR codes need a light ground to scan */
.qr-box {
  display: grid;
  place-items: center;
  margin: 20px auto 0;
  width: 232px;
  height: 232px;
  padding: 16px;
  border-radius: 24px;
  background: #fff;
  border: 1px solid var(--line);
}
.qr-box svg {
  width: 100%;
  height: 100%;
}
.qr-box .fine {
  color: #3a3a40;
}
.center {
  text-align: center;
}

/* Published success (write) */
.published {
  position: absolute;
  inset: 0;
  z-index: 70;
  outline: none;
  overflow-y: auto;
  background: var(--glow), var(--bg);
  animation: celebIn 0.4s var(--ease);
}
.published-inner {
  position: relative;
  z-index: 2;
  max-width: 440px;
  margin: 0 auto;
  padding: calc(var(--safe-top) + 48px) 24px calc(24px + var(--safe-bottom));
  text-align: center;
}
.burst {
  width: 88px;
  height: 88px;
  margin: 0 auto;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--grad-sign);
  color: var(--on-green);
  box-shadow: 0 0 0 12px rgba(82, 99, 68, 0.15);
  animation: titleIn 0.55s cubic-bezier(0.3, 1.5, 0.5, 1) both;
}
.published h2 {
  margin: 24px 0 0;
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.published p {
  margin: 8px 0 0;
  font-size: 16px;
  line-height: 1.5;
  color: var(--text-3);
}
.published .mini-card {
  margin-top: 24px;
  text-align: left;
}
.published .stack {
  display: grid;
  gap: 8px;
  margin-top: 24px;
}

/* Toast */
.toast {
  position: absolute;
  z-index: 95;
  left: 50%;
  bottom: calc(var(--nav-space) + 8px);
  transform: translate(-50%, 20px);
  max-width: calc(100% - 32px);
  padding: 12px 18px;
  border-radius: 999px;
  background: var(--dark);
  color: #f7f7f2;
  font-size: 14px;
  font-weight: 700;
  box-shadow: 0 18px 36px -12px rgba(18, 20, 15, 0.55);
  opacity: 0;
  pointer-events: none;
  transition:
    opacity 0.25s,
    transform 0.3s var(--ease);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.app[data-size='desktop'] .toast {
  bottom: 24px;
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .confetti {
    display: none;
  }
}

/* Bell sits on the canvas (not a photo) on tablet and PC */

/* Progress on photos and dark grounds uses the pale accent so it stays visible */
.ci-progress .progress i,
.tile-meta .progress i,
.celeb-meter .progress i,
.mini-card .progress i {
  background: linear-gradient(90deg, #f4f5e4, var(--pale));
}

/* ───────────────────────── Signing: the original three steps ───────────────────────── */
.sheet.sign {
  background: #f7f8f4;
}
.step-bars {
  display: flex;
  gap: 6px;
  margin: 4px 0 16px;
}
.step-bars i {
  flex: 1;
  height: 4px;
  border-radius: 2px;
  background: #d3d7cb;
  transition: background 0.3s;
}
.step-bars i.on {
  background: var(--dark);
}
.sign-step {
  animation: qIn 0.35s var(--ease);
}
.sign-step.back {
  animation-name: qBack;
}
.sign-title {
  margin: 8px 0 12px !important;
  font-size: 24px !important;
  line-height: 1.15 !important;
  letter-spacing: -0.02em !important;
}
.read-box {
  max-height: 190px;
  overflow-y: auto;
  padding: 16px;
  border-radius: 20px;
  background: var(--surface);
  border: 1px solid var(--line);
  outline: none;
}
.read-box:focus-visible {
  outline: 3px solid #385d88;
}
.read-box h3 {
  margin: 0 !important;
  font-size: 16px !important;
  line-height: 1.3 !important;
}
.read-box p {
  margin: 8px 0 0;
  font-size: 13px;
  line-height: 1.65;
  color: var(--text-2);
}
.read-box p b {
  color: var(--text);
}
.read-box .read-meta {
  font-size: 12px;
  color: var(--text-3);
}
.elig-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
  padding: 12px 14px;
  border-radius: 20px;
  background: var(--lime-soft);
  font-size: 13px;
  font-weight: 600;
  line-height: 1.4;
  color: var(--text-2);
}
.elig-row.bad {
  background: #fbedea;
}
.elig-dot {
  flex: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #326544;
  color: #fff;
  font-size: 12px;
  font-weight: 800;
  animation: titleIn 0.4s 0.15s ease both;
}
.elig-row.bad .elig-dot {
  background: #ba1a1a;
}
.radio-list {
  display: grid;
  gap: 8px;
}
.radio-card {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  width: 100%;
  min-height: 52px;
  padding: 13px 14px;
  border-radius: 20px;
  border: 1.5px solid transparent;
  background: var(--surface);
  text-align: left;
  box-shadow: 0 1px 0 var(--line);
  transition:
    border-color 0.15s,
    transform 0.15s;
}
.radio-card:active {
  transform: scale(0.98);
}
.radio-card[aria-checked='true'] {
  border-color: var(--dark);
}

/* Swipe: the card is sized from the window height and sits on a soft, blurred echo of its photo */
.swipe-ambient {
  display: none;
}

  display: block;
  position: absolute;
  inset: -80px;
  background-size: cover;
  background-position: center;
  filter: blur(70px) saturate(0.8);
  opacity: 0.32;
  transition: background-image 0.6s ease;
  pointer-events: none;
}
.app[data-size='desktop'] .swipe::after {
  content: '';

  inset: 0;

  overflow: hidden;

.app[data-size='desktop'] .swipe-hints {

      if (e.button !== 0 || e.target.closest('button')) return;
      down = true; moved = false; dx = dy = 0;
      sx = e.clientX; sy = e.clientY; t0 = performance.now();
      card.setPointerCapture(e.pointerId);
      card.style.transition = 'none';
    });
    card.addEventListener('pointermove', (e) => {
      if (!down) return;
      dx = e.clientX - sx; dy = e.clientY - sy;
      if (!moved && Math.hypot(dx, dy) > 6) moved = true;
      if (!moved) return;
      card.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 16}deg)`;
      const up = -dy > Math.abs(dx);
      stamps.sign.style.opacity = !up ? Math.max(0, Math.min(1, dx / 110)) : 0;
      stamps.skip.style.opacity = !up ? Math.max(0, Math.min(1, -dx / 110)) : 0;
      stamps.save.style.opacity = up ? Math.max(0, Math.min(1, -dy / 120)) : 0;
      if (nextCard) {
        const k = Math.min(1, Math.hypot(dx, dy) / 160);
        nextCard.style.transition = 'none';
        nextCard.style.transform = `scale(${0.95 + 0.05 * k}) translateY(${10 - 10 * k}px)`;
        nextCard.style.filter = `brightness(${0.55 + 0.45 * k})`;
      }
    });
    const end = (e) => {
      if (!down) return;
      down = false;
      const dt = Math.max(1, performance.now() - t0);
      const vx = dx / dt, vy = dy / dt;
      if (!moved) {
        // Tap: lower info area opens the petition; upper area steps through the card's pages.
        const r = card.getBoundingClientRect();
        const info = $('.card-info', card).getBoundingClientRect();
        if (e.clientY >= info.top + 20) return openDetail(card.dataset.id);
        const p = Number(card.dataset.page);
        const next = e.clientX - r.left > r.width / 2 ? Math.min(2, p + 1) : Math.max(0, p - 1);
        if (next !== p) setPage(next);
        return;
      }
      if (dx > 110 || (vx > 0.55 && dx > 40)) return act('sign', 'drag');
      if (dx < -110 || (vx < -0.55 && dx < -40)) return act('skip', 'drag');
      if ((dy < -130 || (vy < -0.6 && dy < -50)) && -dy > Math.abs(dx)) return act('save', 'drag');
      springBack(card);
    };
    card.addEventListener('pointerup', end);
    card.addEventListener('pointercancel', () => {
      down = false;
      springBack(card);
    });
  }
  function springBack(card) {
    if (!card) return;
    card.style.transition = 'transform .45s cubic-bezier(.3,1.4,.5,1)';
    card.style.transform = '';
    $$('.stamp', card).forEach((s) => (s.style.opacity = 0));
    const n = $('#deck .is-next');
    if (n) {
      n.style.transition = '';
      n.style.transform = '';
      n.style.filter = '';
    }
  }
  function setPage(n) {
    state.page = n;
    const card = $('#deck .card:last-child');
    if (!card) return;
    const p = byId(card.dataset.id);
    const fresh = document.createElement('div');
    fresh.innerHTML = cardHTML(p, '', n);
    card.dataset.page = n;
    $('.card-info', card).replaceWith($('.card-info', fresh.firstElementChild));
    $('.segs', card).replaceWith($('.segs', fresh.firstElementChild));
  }
  function fly(dir) {
    const card = $('#deck .card:last-child');
    if (!card) return Promise.resolve();
    const w = card.offsetWidth, h = card.offsetHeight;
    const stamp = $(`.stamp-${dir === 'right' ? 'sign' : dir === 'left' ? 'skip' : 'save'}`, card);
    if (stamp) stamp.style.opacity = 1;
    card.style.transition = 'transform .34s cubic-bezier(.4,.1,.7,1), opacity .3s ease-in .04s';
    card.style.opacity = '0';
    const m = card.style.transform.match(/translate\(([-\d.]+)px, ([-\d.]+)px\)/);
    const y0 = m ? Number(m[2]) : 0;
    card.style.transform =
      dir === 'up' ? `translate(0, ${-h * 1.2}px) rotate(0deg)` : `translate(${(dir === 'right' ? 1 : -1) * w * 1.5}px, ${y0 - 30}px) rotate(${dir === 'right' ? 26 : -26}deg)`;
    card.style.pointerEvents = 'none';
    const n = $('#deck .is-next');
    if (n) {
      n.style.transition = 'transform .34s var(--ease), filter .34s';
      n.style.transform = 'none';
      n.style.filter = 'none';
    }
    return new Promise((r) => setTimeout(r, reduceMotion() ? 0 : 320));
  }
  function pulse(action) {
    const b = $(`#actions [data-action="${action}"]`);
    if (!b) return;
    b.classList.remove('pulse');
    void b.offsetWidth;
    b.classList.add('pulse');
  }
  function topId() {
    return $('#deck .card:last-child')?.dataset.id;
  }

  async function act(action, via = 'button') {
    const id = topId();
    if (!id && action !== 'undo') return;
    const p = byId(id);
    if (via === 'button') pulse(action);
    if (action === 'skip') {
      await fly('left');
      state.gone.push({ id, a: 'skip' });
      state.page = 0;
      mountDeck('is-enter');
    } else if (action === 'save') {
      await fly('up');
      state.saved.add(id);
      state.gone.push({ id, a: 'save' });
      state.page = 0;
      mountDeck('is-enter');
      toast('Saved. Find it in Profile → Saved.');
    } else if (action === 'share') {
      copyLink(p);
      springBack($('#deck .card:last-child'));
    } else if (action === 'sign') {
      if (signingError(p)) {
        springBack($('#deck .card:last-child'));
        return openSign(id, false);
      }
      await fly('right');
      openSign(id, true);
    } else if (action === 'undo') {
      const last = state.gone.pop();
      if (!last) return;
      if (last.a === 'save') state.saved.delete(last.id);
      state.page = 0;
      mountDeck('is-undo');
      toast(last.a === 'save' ? 'Brought it back and removed it from Saved' : 'Brought it back');
    }
  }

  function copyLink(p) {

  // ───────────────────────── 2. SIGNED celebration ─────────────────────────
  function heartPath(cx, top, w, h) {

  }

  const lowerFirst = (s) => {
    const t = s.replace(/\.$/, '');

  };
  function confetti() {
    const box = $('#confetti');

    box.innerHTML = Array.from({ length: 36 }, (_, i) => {
      const left = Math.random() * 100;
